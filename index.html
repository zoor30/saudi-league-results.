<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>عزبة نجد</title><script src="https://cdn.babylonjs.com/babylon.js"></script><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ccde2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}#c{width:100%;height:100%;display:block;touch-action:none}.ui{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(9px,env(safe-area-inset-top));left:9px;right:9px;display:flex;justify-content:space-between;align-items:flex-start}.panel{background:linear-gradient(180deg,#4b351feF,#2c2016ef);border:2px solid #d9b67a;border-radius:17px;color:#fff;box-shadow:0 7px 18px #0005,inset 0 1px #fff2;padding:8px 11px;font-weight:800}.logo{font-size:17px}.stats{font-size:10px;line-height:1.75;text-align:right}.day{position:absolute;top:max(83px,calc(env(safe-area-inset-top) + 73px));left:50%;transform:translateX(-50%);background:#fff4d9e8;border:1px solid #b8874d;border-radius:14px;padding:5px 11px;color:#51351e;font-size:10px;font-weight:900;box-shadow:0 3px 10px #0002}.bottom{position:absolute;left:8px;right:8px;bottom:max(12px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;pointer-events:auto}.b{min-height:57px;border:2px solid #fff9;border-radius:17px;background:linear-gradient(#ffd966,#e49a25);box-shadow:0 4px 0 #84511e,0 8px 16px #0003;color:#4b2d12;font-weight:900;font-size:11px}.b:active{transform:translateY(3px);box-shadow:0 1px 0 #84511e}.toast{position:absolute;bottom:84px;left:50%;transform:translateX(-50%);background:#241c16e8;color:#fff;border:1px solid #d8bd8b;border-radius:14px;padding:8px 13px;font-size:11px;opacity:0;transition:.2s;white-space:nowrap}.toast.on{opacity:1}.card{display:none;position:absolute;right:9px;top:105px;width:185px;background:#fff5dff2;border:2px solid #8c6134;border-radius:16px;padding:9px;color:#3d2918;box-shadow:0 8px 20px #0003;pointer-events:auto}.card.on{display:block}.card h3{margin:0 0 3px;font-size:15px}.card small{font-size:9px}.meter{height:6px;background:#d9c8ad;border-radius:9px;margin:3px 0 6px;overflow:hidden}.meter i{display:block;height:100%;background:#78964a}.pet{width:100%;border:0;border-radius:9px;padding:6px;background:#e8b44d;font-weight:900}.load{position:fixed;inset:0;z-index:20;background:linear-gradient(#82cce7 0 57%,#d6ad6b 57%);display:flex;align-items:center;justify-content:center;transition:.45s}.loadbox{background:#fff3dceF;border:3px solid #80572f;border-radius:25px;padding:22px;width:min(80vw,300px);text-align:center;color:#432b19;box-shadow:0 18px 45px #0003}.loadbox strong{font-size:24px}.progress{height:10px;background:#d8c6a8;border-radius:20px;margin-top:14px;overflow:hidden}.progress i{display:block;height:100%;width:15%;background:#79984b;animation:p 1.4s ease forwards}@keyframes p{to{width:100%}}</style></head><body><canvas id="c"></canvas><div id="load" class="load"><div class="loadbox"><strong>🐑 عزبة نجد</strong><div style="font-size:11px;margin-top:5px">نبني العزبة ونطلق القطيع…</div><div class="progress"><i></i></div></div></div><div class="ui"><div class="top"><div class="panel logo">عزبة نجد</div><div class="panel stats">🪙 <span id="coins">850</span>　🌾 <span id="stock">12</span><br>المعلف <span id="food">55</span>%　💧 <span id="water">92</span>%<br>🐑 <span id="count">10</span>/10</div></div><div class="day">☀️ صباح نجد • 7:20</div><div id="toast" class="toast"></div><div id="info" class="card"><h3 id="nm"></h3><small id="st"></small><div style="font-size:9px;margin-top:6px">الشبع</div><div class="meter"><i id="mf"></i></div><div style="font-size:9px">الارتواء</div><div class="meter"><i id="mw"></i></div><div style="font-size:9px">الطاقة</div><div class="meter"><i id="me"></i></div><button id="pet" class="pet">ربّت عليها 🤚</button></div><div class="bottom"><button class="b" id="feed">🌾<br>عبّ المعلف</button><button class="b" id="fill">💧<br>عبّ الماء</button><button class="b" id="truck">🛻<br>الوايت</button><button class="b" id="market">📰<br>السوق</button></div></div><script>(()=>{const $=x=>document.querySelector(x),canvas=$('#c');const eng=new BABYLON.Engine(canvas,true,{antialias:true,powerPreference:'high-performance'});eng.setHardwareScalingLevel(Math.max(1,devicePixelRatio>2?1.35:1));const s=new BABYLON.Scene(eng);s.clearColor=new BABYLON.Color4(.52,.78,.86,1);s.ambientColor=new BABYLON.Color3(.4,.4,.35);s.fogMode=BABYLON.Scene.FOGMODE_LINEAR;s.fogStart=28;s.fogEnd=68;s.fogColor=new BABYLON.Color3(.72,.76,.69);const cam=new BABYLON.ArcRotateCamera('cam',-1.12,.93,25,new BABYLON.Vector3(0,0,0),s);cam.attachControl(canvas,true);cam.lowerRadiusLimit=13;cam.upperRadiusLimit=31;cam.lowerBetaLimit=.68;cam.upperBetaLimit=1.18;cam.panningSensibility=130;cam.pinchPrecision=75;cam.wheelPrecision=55;const hemi=new BABYLON.HemisphericLight('sky',new BABYLON.Vector3(0,1,0),s);hemi.intensity=.9;hemi.groundColor=new BABYLON.Color3(.36,.27,.17);const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.45,-1,.35),s);sun.position.set(15,25,-12);sun.intensity=1.65;const sh=new BABYLON.ShadowGenerator(1024,sun);sh.usePercentageCloserFiltering=true;sh.filteringQuality=BABYLON.ShadowGenerator.QUALITY_LOW;function mat(n,c,rough=.8){let m=new BABYLON.PBRMaterial(n,s);m.albedoColor=BABYLON.Color3.FromHexString(c);m.roughness=rough;m.metallic=0;return m}const sand=mat('warm sand','#cda567'),sand2=mat('tracks','#b88c50'),wood=mat('aged wood','#6b4d31'),steel=mat('galvanized','#727b78',.5),dark=mat('najdi','#171513'),dark2=mat('najdi2','#27221c'),shade=mat('tarp','#526f5c'),hay=mat('hay','#c99a32'),white=mat('truck white','#e7e4dc',.45),glass=mat('glass','#7096a0',.2),rubber=mat('rubber','#1c1d1c'),red=mat('tail','#8d281f'),waterM=mat('water','#379ec4',.15);waterM.alpha=.82;function box(n,w,h,d,x,y,z,m){let q=BABYLON.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},s);q.position.set(x,y,z);q.material=m;q.receiveShadows=true;sh.addShadowCaster(q);return q}function cyl(n,d,h,x,y,z,m,t=10){let q=BABYLON.MeshBuilder.CreateCylinder(n,{diameter:d,height:h,tessellation:t},s);q.position.set(x,y,z);q.material=m;sh.addShadowCaster(q);return q}const g=BABYLON.MeshBuilder.CreateGround('desert',{width:90,height:90,subdivisions:2},s);g.material=sand;g.receiveShadows=true;// distant dunes
for(let i=0;i<14;i++){let d=BABYLON.MeshBuilder.CreateSphere('dune',{diameter:10+Math.random()*13,segments:10},s);d.scaling.y=.16+Math.random()*.08;let a=i/14*Math.PI*2,r=28+Math.random()*13;d.position.set(Math.cos(a)*r,-1.2,Math.sin(a)*r);d.material=sand;d.receiveShadows=true} // tire tracks and scrub
for(let i=0;i<22;i++){let p=box('track',.12,.015,2.1,-8+i*.55,.012,9.2,sand2);p.rotation.y=-.22}for(let i=0;i<45;i++){let x=(Math.random()-.5)*48,z=(Math.random()-.5)*48;if(Math.abs(x)<13&&Math.abs(z)<12)continue;let bush=cyl('scrub',.18+Math.random()*.2,.25+Math.random()*.25,x,.13,z,mat('scrubm'+i,Math.random()>.5?'#777344':'#8b7743'),6);bush.rotation.z=(Math.random()-.5)*.5}// fence
for(let x=-12;x<=12;x+=1.5){cyl('post',.17,1.55,x,.78,-11,wood,8);cyl('post',.17,1.55,x,.78,11,wood,8)}for(let z=-9.5;z<=9.5;z+=1.5){cyl('post',.17,1.55,-12,.78,z,wood,8);cyl('post',.17,1.55,12,.78,z,wood,8)}for(const z of[-11,11])for(const y of[.42,.84,1.26])box('wire',24,.035,.035,0,y,z,steel);for(const x of[-12,12])for(const y of[.42,.84,1.26])box('wire',.035,.035,22,x,y,0,steel);// shade shelter
for(const x of[-8,-1])for(const z of[-7,-2])cyl('pole',.2,3.15,x,1.58,z,wood,8);let roof=box('tarp',7.7,.12,5.7,-4.5,3.18,-4.5,shade);roof.rotation.z=-.025;for(let x=-8;x<-.7;x+=.38)box('rib',.035,.04,5.6,x,3.25,-4.5,steel);// feeder + water
const feeder=box('feeder',5.8,.5,1.2,3.3,.28,-5.2,steel),grain=box('grain',5.15,.1,.75,3.3,.57,-5.2,hay),trough=box('trough',3.5,.55,1.5,5.4,.3,5.2,steel),wm=box('water',3.1,.045,1.08,5.4,.59,5.2,waterM);for(let i=0;i<5;i++){let h=cyl('bale',1.25,1.05,-8+i*1.15,.64,7.1,hay,18);h.rotation.z=Math.PI/2}// pickup
const pickup=new BABYLON.TransformNode('white pickup',s);function pb(n,w,h,d,x,y,z,m){let q=box(n,w,h,d,x,y,z,m);q.parent=pickup;return q}pb('chassis',4.8,.25,1.9,0,.62,0,steel);pb('body',4.6,.62,1.84,0,.96,0,white);pb('cab',1.8,1.15,1.8,-1.15,1.62,0,white);pb('hood',1.35,.34,1.82,-2.25,1.32,0,white);pb('windshield',.06,.62,1.48,-2.03,1.86,0,glass);pb('bedfloor',2.2,.12,1.65,1.25,1.33,0,wood);for(const z of[-.9,.9])pb('bedside',2.35,.55,.1,1.25,1.58,z,white);pb('tailgate',.1,.55,1.85,2.43,1.58,0,white);pb('bumper',.18,.15,2.02,-2.98,.84,0,steel);for(const x of[-1.85,1.65])for(const z of[-1.01,1.01]){let w=cyl('wheel',.92,.28,x,.57,z,rubber,20);w.rotation.x=Math.PI/2;w.parent=pickup;let r=cyl('rim',.48,.3,x,.57,z,steel,18);r.rotation.x=Math.PI/2;r.parent=pickup}pickup.position.set(-6,0,8);pickup.rotation.y=-.25;let truckOn=false,truckDir=1;// sheep procedural articulated
const flock=[];const obstacles=[{x:3.3,z:-5.2,hx:3.6,hz:1.3},{x:5.4,z:5.2,hx:2.2,hz:1.5},{x:-4.5,z:-4.5,hx:4.2,hz:3.5}];function free(x,z){return x>-10.5&&x<10.5&&z>-9.5&&z<9.5&&!obstacles.some(o=>Math.abs(x-o.x)<o.hx&&Math.abs(z-o.z)<o.hz)}function newTarget(a){for(let k=0;k<30;k++){let x=-9+Math.random()*18,z=-8+Math.random()*16;if(free(x,z)){a.tx=x;a.tz=z;return}}}function sheep(i){let root=new BABYLON.TransformNode('Najdi'+i,s),m=i===9?dark:dark2;let body=BABYLON.MeshBuilder.CreateSphere('body',{diameter:1.35,segments:14},s);body.scaling.set(1.35,.8,.68);body.position.y=1;body.material=m;body.parent=root;let neck=cyl('neck',.42,1.1,-.72,1.45,0,m,10);neck.rotation.z=-.22;neck.parent=root;let head=BABYLON.MeshBuilder.CreateSphere('head',{diameter:.58,segments:12},s);head.scaling.set(.72,1.18,.66);head.position.set(-1.02,1.92,0);head.material=m;head.parent=root;let ears=[];for(const z of[-.34,.34]){let e=BABYLON.MeshBuilder.CreateCapsule('ear',{radius:.055,height:.55,tessellation:8},s);e.position.set(-1.02,2.02,z);e.rotation.x=Math.PI/2;e.material=m;e.parent=root;ears.push(e)}let legs=[];for(const x of[-.52,.5])for(const z of[-.32,.32]){let l=cyl('leg',.11,.76,x,.42,z,m,7);l.parent=root;legs.push(l)}if(i===9)for(const z of[-.28,.28]){let h=BABYLON.MeshBuilder.CreateTorus('horn',{diameter:.42,thickness:.07,tessellation:14},s);h.position.set(-1,2.08,z);h.rotation.x=Math.PI/2;h.material=hay;h.parent=root}root.getChildMeshes().forEach(x=>sh.addShadowCaster(x));do root.position.set(-8+Math.random()*16,0,-7+Math.random()*14);while(!free(root.position.x,root.position.z));let a={root,head,ears,legs,name:i===9?'الفحل صنف':'نجدية '+(i+1),hunger:55+Math.random()*35,thirst:55+Math.random()*35,energy:65+Math.random()*30,state:'wander',tx:0,tz:0,timer:1+Math.random()*4,phase:Math.random()*6,speed:.55+Math.random()*.25};newTarget(a);flock.push(a);root.metadata=a}for(let i=0;i<10;i++)sheep(i);let food=55,water=92,stock=12,selected=null;const stateName={wander:'تتمشى في الحوش',idle:'واقفة تراقب',food:'متجهة للمعلف',eat:'تأكل الشعير',water:'متجهة للماء',drink:'تشرب',rest:'تستريح',fear:'مفزوعة من الوايت'};function toast(t){let e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('on'),1500)}function updateInfo(){if(!selected)return;$('#nm').textContent=selected.name;$('#st').textContent=stateName[selected.state]||selected.state;$('#mf').style.width=selected.hunger+'%';$('#mw').style.width=selected.thirst+'%';$('#me').style.width=selected.energy+'%'}s.onPointerObservable.add(p=>{if(p.type!==BABYLON.PointerEventTypes.POINTERPICK||!p.pickInfo.hit)return;let n=p.pickInfo.pickedMesh;while(n&&n.parent)n=n.parent;if(n&&n.metadata){selected=n.metadata;$('#info').classList.add('on');updateInfo()}});$('#pet').onclick=()=>{if(selected){selected.energy=Math.min(100,selected.energy+5);toast('ارتاحت لك '+selected.name+' 🐑');updateInfo()}};$('#feed').onclick=()=>{if(stock<=0)return toast('مخزون الشعير خلص');stock--;food=Math.min(100,food+35);$('#stock').textContent=stock;$('#food').textContent=Math.round(food);grain.scaling.y=.7+food/150;toast('عبّيت المعلف 🌾')};$('#fill').onclick=()=>{water=100;$('#water').textContent=100;wm.scaling.y=1;toast('عبّيت الحوض 💧')};$('#truck').onclick=()=>{truckOn=!truckOn;toast(truckOn?'شغلت الوايت 🛻':'وقفت الوايت')};$('#market').onclick=()=>toast('السوق يفتح في المرحلة القادمة');let last=performance.now();eng.runRenderLoop(()=>{let now=performance.now(),dt=Math.min(.04,(now-last)/1000);last=now,t=now/1000;food=Math.max(0,food-dt*.035);water=Math.max(0,water-dt*.025);for(let a of flock){a.hunger=Math.max(0,a.hunger-dt*.16);a.thirst=Math.max(0,a.thirst-dt*.21);if(a.state!=='rest')a.energy=Math.max(0,a.energy-dt*.035);let dx=pickup.position.x-a.root.position.x,dz=pickup.position.z-a.root.position.z,distTruck=Math.hypot(dx,dz);if(truckOn&&distTruck<4.3){a.state='fear';let q=Math.max(.1,distTruck);a.tx=a.root.position.x-dx/q*4;a.tz=a.root.position.z-dz/q*4}else if(a.hunger<38&&food>2&&a.state!=='eat'){a.state='food';a.tx=1.1+(a.name.length%5)*.85;a.tz=-4.15}else if(a.thirst<35&&water>2&&a.state!=='drink'){a.state='water';a.tx=3.7+(a.name.length%4)*.75;a.tz=4.1}else if(a.energy<25){a.state='rest'}if(a.state==='rest'){a.energy=Math.min(100,a.energy+dt*2.2);a.root.scaling.y=.88;a.head.rotation.z=.12*Math.sin(t+a.phase);if(a.energy>72){a.root.scaling.y=1;a.state='wander';newTarget(a)}continue}let dx2=a.tx-a.root.position.x,dz2=a.tz-a.root.position.z,d=Math.hypot(dx2,dz2);if(d>.3){let vx=dx2/d,vz=dz2/d;for(let b of flock){if(b===a)continue;let sx=a.root.position.x-b.root.position.x,sz=a.root.position.z-b.root.position.z,sd=Math.hypot(sx,sz);if(sd<1.15&&sd>.05){vx+=sx/sd*(1.15-sd)*1.4;vz+=sz/sd*(1.15-sd)*1.4}}let vl=Math.hypot(vx,vz)||1;vx/=vl;vz/=vl;let sp=a.state==='fear'?1.7:a.speed;a.root.position.x+=vx*sp*dt;a.root.position.z+=vz*sp*dt;a.root.rotation.y=Math.atan2(-vz,vx);a.legs.forEach((l,j)=>l.rotation.z=Math.sin(t*7*sp+a.phase+j*Math.PI)*.25);a.ears.forEach((e,j)=>e.rotation.z=.08*Math.sin(t*3+a.phase+j));a.root.position.y=Math.abs(Math.sin(t*7*sp+a.phase))*.018}else{if(a.state==='food'){a.state='eat';a.timer=4+Math.random()*4}else if(a.state==='water'){a.state='drink';a.timer=3+Math.random()*3}else if(a.state==='eat'){a.timer-=dt;a.head.rotation.z=.3+.13*Math.sin(t*4);a.hunger=Math.min(100,a.hunger+dt*7);food=Math.max(0,food-dt*.8);if(a.timer<0||food<=0){a.head.rotation.z=0;a.state='wander';newTarget(a)}}else if(a.state==='drink'){a.timer-=dt;a.head.rotation.z=.35+.08*Math.sin(t*3);a.thirst=Math.min(100,a.thirst+dt*9);water=Math.max(0,water-dt*.8);if(a.timer<0||water<=0){a.head.rotation.z=0;a.state='wander';newTarget(a)}}else{a.timer-=dt;a.head.rotation.y=.18*Math.sin(t*.9+a.phase);if(a.timer<0){a.state=Math.random()<.25?'idle':'wander';a.timer=1+Math.random()*4;if(a.state==='wander')newTarget(a)}}}if(!free(a.root.position.x,a.root.position.z)){a.root.position.x-=dx2/d*.04||0;a.root.position.z-=dz2/d*.04||0;newTarget(a)}}if(truckOn){pickup.position.x+=dt*1.25*truckDir;if(pickup.position.x>7||pickup.position.x<-7)truckDir*=-1;pickup.rotation.y=truckDir>0?-Math.PI/2:Math.PI/2}$('#food').textContent=Math.round(food);$('#water').textContent=Math.round(water);if(selected)updateInfo();s.render()});setTimeout(()=>{$('#load').style.opacity=0;setTimeout(()=>$('#load').remove(),500)},850);addEventListener('resize',()=>eng.resize())})()</script></body></html>
