<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>عزبة نجد</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9fd7ee;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start}.brand,.stats,.tip{background:rgba(67,45,22,.84);color:#fff;border:2px solid rgba(255,255,255,.35);box-shadow:0 4px 12px #0003;border-radius:16px}.brand{padding:8px 13px;font-weight:900;font-size:19px}.stats{padding:7px 10px;font-size:13px;line-height:1.6}.bottom{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:10px;right:10px;display:flex;gap:8px;justify-content:center;pointer-events:auto}.btn{border:0;border-radius:17px;padding:11px 14px;background:linear-gradient(#ffe18b,#e6a43b);box-shadow:0 4px 0 #995b1f,0 7px 14px #0003;font-weight:900;color:#4d2d12;font-size:14px;min-width:75px}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #995b1f}.tip{position:absolute;top:92px;left:50%;transform:translateX(-50%);padding:7px 12px;font-size:12px;white-space:nowrap;transition:.3s}.toast{position:absolute;bottom:92px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#2f251acc;color:white;padding:9px 15px;border-radius:14px;transition:.25s;font-weight:700;white-space:nowrap}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body><div id="game"></div><div class="hud"><div class="top"><div class="brand">🐑 عزبة نجد</div><div class="stats"><b>المستوى 1</b><br>🪙 <span id="coins">850</span> &nbsp; 🌾 <span id="feed">12</span><br>القطيع: 10</div></div><div class="tip" id="tip">اسحب لتحريك العزبة • قرّب بإصبعين</div><div class="toast" id="toast"></div><div class="bottom"><button class="btn" id="feedBtn">🌾 علف</button><button class="btn" id="waterBtn">💧 ماء</button><button class="btn" id="marketBtn">📰 السوق</button></div></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x9fd9ef); scene.fog=new THREE.Fog(0x9fd9ef,28,62);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100); camera.position.set(13,18,22); camera.lookAt(0,0,0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; document.querySelector('#game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff2ce,0x7a633d,2.2)); const sun=new THREE.DirectionalLight(0xffe4b0,3.2); sun.position.set(-10,20,8); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=22;sun.shadow.camera.bottom=-22;scene.add(sun);
const mat=(c,rough=.85)=>new THREE.MeshStandardMaterial({color:c,roughness:rough});
function box(n,s,p,c,rot=0){const m=new THREE.Mesh(new THREE.BoxGeometry(...s),mat(c));m.name=n;m.position.set(...p);m.rotation.y=rot;m.castShadow=m.receiveShadow=true;scene.add(m);return m}
// desert + greenish livestock yard
const ground=new THREE.Mesh(new THREE.PlaneGeometry(70,70),mat(0xd8b56f));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const yard=new THREE.Mesh(new THREE.CircleGeometry(15,64),mat(0xb8b36b));yard.rotation.x=-Math.PI/2;yard.position.y=.025;yard.receiveShadow=true;scene.add(yard);
// dirt patches
for(let i=0;i<26;i++){const d=new THREE.Mesh(new THREE.CircleGeometry(.25+Math.random()*.8,12),mat(0xc49a58));d.rotation.x=-Math.PI/2;d.position.set((Math.random()-.5)*25,.035,(Math.random()-.5)*25);d.scale.y=.5;scene.add(d)}
// fence
const fenceMat=mat(0x6f4c2c);for(let x=-12;x<=12;x+=2){box('fence',[.16,1.35,.16],[x,.68,-11.5],0x6f4c2c);box('fence',[.16,1.35,.16],[x,.68,11.5],0x6f4c2c)}for(let z=-10;z<=10;z+=2){box('fence',[.16,1.35,.16],[-12,.68,z],0x6f4c2c);box('fence',[.16,1.35,.16],[12,.68,z],0x6f4c2c)}for(const z of [-11.5,11.5])for(const y of [.5,1.05])box('rail',[24,.13,.13],[0,y,z],0x7d5630);for(const x of [-12,12])for(const y of [.5,1.05])box('rail',[.13,.13,23],[x,y,0],0x7d5630);
// shade canopy
for(const x of [-7,-1])for(const z of [-7,-2])box('pole',[.15,3,.15],[x,1.5,z],0x66513a);const shade=box('مشمع',[6.5,.12,5.5],[-4,3,-4.5],0x315c50);shade.rotation.z=-.03;
// troughs
box('معلف',[5,.45,1],[3,.25,-5],0x7d8584);box('water',[3,.5,1.3],[5,.25,5],0x68777b);
const water=new THREE.Mesh(new THREE.BoxGeometry(2.65,.04,.95),new THREE.MeshStandardMaterial({color:0x4db8db,metalness:.1,roughness:.25}));water.position.set(5,.52,5);scene.add(water);
// hay bales
for(let i=0;i<4;i++){const h=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,1.15,16),mat(0xd9a72f));h.rotation.z=Math.PI/2;h.position.set(-8+i*1.25,.65,6.8);h.castShadow=true;scene.add(h)}
// stylized old white pickup
const truck=new THREE.Group();function part(g,geo,c,p){const m=new THREE.Mesh(geo,mat(c));m.position.set(...p);m.castShadow=true;g.add(m);return m}part(truck,new THREE.BoxGeometry(4,1,1.8),0xe9e5d9,[0,1,0]);part(truck,new THREE.BoxGeometry(1.7,.85,1.72),0xe9e5d9,[-.7,1.75,0]);part(truck,new THREE.BoxGeometry(1.35,.58,1.55),0x7eb1bc,[-.72,1.82,0]);part(truck,new THREE.BoxGeometry(1.6,.7,1.55),0x7b5a37,[1.1,1.45,0]);for(const x of [-1.25,1.25])for(const z of [-.95,.95]){const w=part(truck,new THREE.CylinderGeometry(.45,.45,.25,16),0x292929,[x,.62,z]);w.rotation.x=Math.PI/2}truck.position.set(-6,0,8.7);truck.rotation.y=-.18;scene.add(truck);
// sheep factory: black Najdi, long ears, ram horns
const sheep=[];function makeSheep(i,ram=false){const g=new THREE.Group();const wool=ram?0x161411:0x201d19, skin=0x171513;const body=part(g,new THREE.SphereGeometry(1,16,12),wool,[0,1.15,0]);body.scale.set(1.25,.82,.72);const neck=part(g,new THREE.CylinderGeometry(.28,.38,1.35,10),skin,[-.78,1.65,0]);neck.rotation.z=-.22;const head=part(g,new THREE.SphereGeometry(.48,14,10),skin,[-1.03,2.15,0]);head.scale.set(.78,1.05,.68);for(const z of [-.42,.42]){const ear=part(g,new THREE.CapsuleGeometry(.11,.58,4,8),0x1b1815,[-1.02,2.28,z]);ear.rotation.x=Math.PI/2;ear.rotation.z=.18}for(const z of [-.32,.32]){const eye=part(g,new THREE.SphereGeometry(.055,8,6),0xf2d67c,[-1.38,2.28,z]);if(ram){const horn=part(g,new THREE.TorusGeometry(.28,.07,7,12,Math.PI*1.35),0xd7b77a,[-.92,2.38,z]);horn.rotation.x=Math.PI/2}}const legs=[];for(const x of [-.62,.58])for(const z of [-.42,.42]){const leg=part(g,new THREE.CylinderGeometry(.075,.09,.92,7),skin,[x,.55,z]);legs.push(leg)}g.scale.setScalar(ram?1.08:.88+Math.random()*.08);g.position.set(-7+Math.random()*14,0,-7+Math.random()*13);g.userData={target:new THREE.Vector3(),speed:.5+Math.random()*.35,t:Math.random()*5,state:'wander',legs,phase:Math.random()*6,ram};scene.add(g);pickTarget(g);sheep.push(g);return g}
function pickTarget(s){s.userData.target.set(-8+Math.random()*16,0,-8+Math.random()*16);s.userData.wait=1+Math.random()*3}
for(let i=0;i<9;i++)makeSheep(i,false);makeSheep(9,true);
let feeding=false,feed=12;function sendToFeed(){if(feed<=0){toast('خلص العلف');return}feed--;document.querySelector('#feed').textContent=feed;feeding=true;sheep.forEach((s,i)=>{s.userData.target.set(1+i*.42,0,-4.2+(i%2)*.5);s.userData.state='feed'});toast('القطيع راح للمعلف 🌾');setTimeout(()=>{feeding=false;sheep.forEach(s=>{s.userData.state='wander';pickTarget(s)})},9000)}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.classList.add('on');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('on'),1800)}
document.querySelector('#feedBtn').onclick=sendToFeed;document.querySelector('#waterBtn').onclick=()=>{sheep.forEach((s,i)=>{s.userData.target.set(4+(i%3)*.55,0,4.2+Math.floor(i/3)*.35);s.userData.state='water'});toast('النجديات متجهة للماء 💧')};document.querySelector('#marketBtn').onclick=()=>toast('السوق قريبًا — شعير • برسيم • ناقة');setTimeout(()=>document.querySelector('#tip').style.opacity=0,5000);
// camera touch drag + pinch
let pts=new Map(),lastMid=null,lastDist=0,camTarget=new THREE.Vector3(0,0,0),zoom=1;renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY})});renderer.domElement.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=[...pts.values()];if(a.length===1){if(lastMid){const dx=a[0].x-lastMid.x,dy=a[0].y-lastMid.y;camTarget.x-=dx*.018*zoom;camTarget.z-=dy*.018*zoom;camTarget.x=THREE.MathUtils.clamp(camTarget.x,-6,6);camTarget.z=THREE.MathUtils.clamp(camTarget.z,-6,6)}lastMid={...a[0]}}else if(a.length>=2){const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastDist)zoom=THREE.MathUtils.clamp(zoom-(d-lastDist)*.004,.62,1.5);lastDist=d}});function end(e){pts.delete(e.pointerId);lastMid=null;lastDist=0}renderer.domElement.addEventListener('pointerup',end);renderer.domElement.addEventListener('pointercancel',end);
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),time=performance.now()*.001;for(const s of sheep){const u=s.userData,delta=u.target.clone().sub(s.position);delta.y=0;const dist=delta.length();if(dist>.35){delta.normalize();s.position.addScaledVector(delta,u.speed*dt);const ang=Math.atan2(delta.x,delta.z)-Math.PI/2;s.rotation.y=THREE.MathUtils.lerp(s.rotation.y,ang,.08);const step=Math.sin(time*7+u.phase)*.25;u.legs.forEach((l,j)=>l.rotation.z=step*(j%2?1:-1));s.position.y=Math.abs(Math.sin(time*7+u.phase))*.025}else{u.legs.forEach(l=>l.rotation.z*=.8);u.wait-=dt;if((u.state==='feed'||u.state==='water')){s.rotation.z=.08*Math.sin(time*2+u.phase);s.children[2].rotation.z=-.22+.18*Math.sin(time*2)}else if(u.wait<=0)pickTarget(s)} }
const desired=new THREE.Vector3(13*zoom+camTarget.x,18*zoom,22*zoom+camTarget.z);camera.position.lerp(desired,.06);camera.lookAt(camTarget);renderer.render(scene,camera)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
