<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>عزبة نجد</title>
<link rel="preconnect" href="https://cdn.babylonjs.com" crossorigin><link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8fd4ea;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}#renderCanvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px}.card{background:linear-gradient(#5d3d23ef,#3b2818ef);color:#fff;border:2px solid #f2d39b88;border-radius:18px;padding:9px 12px;box-shadow:0 6px 18px #0004;font-weight:900}.brand{font-size:18px}.stats{font-size:11px;line-height:1.75}.bottom{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:7px;right:7px;display:flex;gap:6px;pointer-events:auto}.btn{flex:1;border:2px solid #fff8;border-radius:16px;padding:11px 7px;background:linear-gradient(#ffe17f,#e9a22f);box-shadow:0 4px 0 #87501d,0 8px 16px #0003;font-weight:900;color:#472b14;font-size:12px}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #87501d}.loading{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(#8fd4ea 0 56%,#d8b476 56% 100%);transition:.3s}.loadcard{width:min(84vw,330px);background:#fff8ebf2;border:3px solid #86582f;border-radius:24px;padding:21px;text-align:center;box-shadow:0 18px 40px #0003;color:#432b18}.title{font-size:25px;font-weight:1000}.sub{font-size:12px;margin-top:6px;opacity:.72}.bar{height:12px;border-radius:99px;background:#d8cab3;overflow:hidden;margin-top:15px}.fill{height:100%;width:8%;background:linear-gradient(90deg,#d99a31,#7d9e4a);transition:.25s}.toast{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);background:#302219e9;color:#fff;padding:9px 14px;border-radius:13px;opacity:0;transition:.2s;white-space:nowrap}.toast.on{opacity:1}.animal{display:none;position:absolute;top:100px;right:10px;width:190px;background:#fff8eaf4;border:2px solid #80552e;border-radius:17px;padding:10px;box-shadow:0 8px 20px #0003;color:#3b291a;pointer-events:auto}.animal.on{display:block}.animal h3{margin:0 0 5px}.small{font-size:10px;opacity:.7}.row{font-size:10px;margin:5px 0}.meter{height:7px;background:#ddd0bd;border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:#799844}.pet{width:100%;border:0;border-radius:10px;padding:7px;margin-top:6px;background:#e8b34d;font-weight:900}</style>
<script src="https://cdn.babylonjs.com/babylon.js"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script></head><body>
<canvas id="renderCanvas"></canvas><div id="loading" class="loading"><div class="loadcard"><div class="title">🐑 عزبة نجد</div><div id="loadText" class="sub">تشغيل المحرك وتجهيز العزبة…</div><div class="bar"><div id="loadFill" class="fill"></div></div></div></div>
<div class="hud"><div class="top"><div class="card brand">🐑 عزبة نجد</div><div class="card stats">المستوى 1<br>🪙 850　🌾 <span id="feedStock">12</span><br>المعلف <span id="food">40</span>%　💧 <span id="water">100</span>%<br>القطيع <span id="count">0</span>/10</div></div><div id="toast" class="toast"></div><div id="animal" class="animal"><h3 id="name"></h3><div id="state" class="small"></div><div class="row">الشبع<div class="meter"><i id="mFood"></i></div></div><div class="row">الارتواء<div class="meter"><i id="mWater"></i></div></div><div class="row">الطاقة<div class="meter"><i id="mEnergy"></i></div></div><button id="pet" class="pet">ربّت عليها 🤚</button></div><div class="bottom"><button class="btn" id="feedBtn">🌾 عبّ المعلف</button><button class="btn" id="waterBtn">💧 عبّ الماء</button><button class="btn" id="truckBtn">🛻 الوايت</button><button class="btn" id="marketBtn">📰 السوق</button></div></div>
<script>
(()=>{const $=s=>document.querySelector(s),canvas=$('#renderCanvas');let engine;try{engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true,antialias:true,powerPreference:'high-performance'});}catch(e){$('#loadText').textContent='تعذر تشغيل WebGL على هذا الجهاز';return}const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.56,.83,.92,1);scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;scene.fogDensity=.012;scene.fogColor=new BABYLON.Color3(.72,.78,.72);
const cam=new BABYLON.ArcRotateCamera('cam',-Math.PI/3,1.03,28,new BABYLON.Vector3(0,0,0),scene);cam.attachControl(canvas,true);cam.lowerRadiusLimit=15;cam.upperRadiusLimit=36;cam.lowerBetaLimit=.65;cam.upperBetaLimit=1.3;cam.panningSensibility=120;cam.wheelPrecision=50;cam.pinchPrecision=65;cam.useNaturalPinchZoom=true;
const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=1.0;hemi.groundColor=new BABYLON.Color3(.36,.28,.18);const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.45,-1,.3),scene);sun.position=new BABYLON.Vector3(12,24,-10);sun.intensity=2.0;const shadow=new BABYLON.ShadowGenerator(1024,sun);shadow.useBlurExponentialShadowMap=true;shadow.blurKernel=24;
const mat=(n,c)=>{const m=new BABYLON.StandardMaterial(n,scene);m.diffuseColor=BABYLON.Color3.FromHexString(c);m.specularColor=new BABYLON.Color3(.08,.08,.08);return m};const sand=mat('sand','#d1ad70'),metal=mat('metal','#656661'),wood=mat('wood','#725438'),shade=mat('shade','#536b5c'),grainMat=mat('grain','#c99d3c'),waterMat=mat('water','#42a7cd');waterMat.alpha=.82;
const ground=BABYLON.MeshBuilder.CreateGround('ground',{width:80,height:80},scene);ground.material=sand;ground.receiveShadows=true;
for(let i=0;i<60;i++){const p=BABYLON.MeshBuilder.CreateDisc('patch',{radius:.15+Math.random()*.7,tessellation:10},scene);p.rotation.x=Math.PI/2;p.scaling.y=.45;p.position=new BABYLON.Vector3((Math.random()-.5)*45,.01,(Math.random()-.5)*45);p.material=mat('p'+i,Math.random()>.5?'#bd9153':'#dfbd7b');}
function box(n,w,h,d,x,y,z,m){const b=BABYLON.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},scene);b.position.set(x,y,z);b.material=m;b.receiveShadows=true;shadow.addShadowCaster(b);return b}function cyl(n,diam,h,x,y,z,m){const b=BABYLON.MeshBuilder.CreateCylinder(n,{diameter:diam,height:h,tessellation:8},scene);b.position.set(x,y,z);b.material=m;shadow.addShadowCaster(b);return b}
for(let x=-12;x<=12;x+=1.5){cyl('p',.16,1.5,x,.75,-11,wood);cyl('p',.16,1.5,x,.75,11,wood)}for(let z=-9.5;z<=9.5;z+=1.5){cyl('p',.16,1.5,-12,.75,z,wood);cyl('p',.16,1.5,12,.75,z,wood)}for(const z of[-11,11])for(const y of[.4,.85,1.28])box('rail',24,.06,.06,0,y,z,metal);for(const x of[-12,12])for(const y of[.4,.85,1.28])box('rail',.06,.06,22,x,y,0,metal);
for(const x of[-8,-1])for(const z of[-7,-2])cyl('pole',.18,3.2,x,1.6,z,wood);box('roof',7.7,.14,5.8,-4.5,3.2,-4.5,shade);
const feeder=box('feeder',5.7,.5,1.15,3.4,.27,-5.2,metal),grain=box('grain',5.1,.1,.76,3.4,.56,-5.2,grainMat),trough=box('trough',3.4,.55,1.45,5.4,.3,5.4,metal),waterMesh=box('water',3.05,.05,1.08,5.4,.59,5.4,waterMat);
for(let i=0;i<5;i++){const h=BABYLON.MeshBuilder.CreateCylinder('hay',{diameter:1.25,height:1.05,tessellation:18},scene);h.rotation.z=Math.PI/2;h.position.set(-8+i*1.2,.65,7);h.material=grainMat;shadow.addShadowCaster(h)}
const obs=[{x:3.4,z:-5.2,hx:3.3,hz:1.25},{x:5.4,z:5.4,hx:2.1,hz:1.45},{x:-8,z:-7,hx:.6,hz:.6},{x:-1,z:-7,hx:.6,hz:.6},{x:-8,z:-2,hx:.6,hz:.6},{x:-1,z:-2,hx:.6,hz:.6}];const animals=[];let food=40,water=100,stock=12,truck=null,truckOn=false,selected=null;const stateText={wander:'يتمشى',idle:'واقف يراقب',food:'رايح للمعلف',eat:'يأكل',water:'رايح للماء',drink:'يشرب',rest:'يرتاح',startled:'مفزوع من الوايت'};
function valid(x,z){if(x<-10||x>10||z<-9||z>9)return false;return !obs.some(o=>Math.abs(x-o.x)<o.hx+.65&&Math.abs(z-o.z)<o.hz+.65)}function targetFor(a){for(let k=0;k<20;k++){const x=-9+Math.random()*18,z=-8+Math.random()*16;if(valid(x,z)){a.target.set(x,0,z);return}}}
function fallbackSheep(i){const root=new BABYLON.TransformNode('sheep'+i,scene),black=mat('black'+i,i===9?'#15120f':'#24201c');const body=BABYLON.MeshBuilder.CreateSphere('body',{diameter:1.45,segments:16},scene);body.scaling.set(1.25,.82,.75);body.position.y=.95;body.material=black;body.parent=root;const head=BABYLON.MeshBuilder.CreateSphere('head',{diameter:.65,segments:14},scene);head.scaling.set(.72,1.05,.7);head.position.set(-.95,1.5,0);head.material=black;head.parent=root;for(const z of[-.36,.36]){const ear=BABYLON.MeshBuilder.CreateCapsule('ear',{radius:.07,height:.52,tessellation:8},scene);ear.rotation.x=Math.PI/2;ear.position.set(-1,1.65,z);ear.material=black;ear.parent=root}for(const x of[-.48,.48])for(const z of[-.34,.34]){const leg=BABYLON.MeshBuilder.CreateCylinder('leg',{diameter:.11,height:.72,tessellation:7},scene);leg.position.set(x,.38,z);leg.material=black;leg.parent=root}root.getChildMeshes().forEach(m=>shadow.addShadowCaster(m));return root}
async function makeFlock(){let template=null;try{$('#loadText').textContent='تحميل موديل النجديات الحقيقي…';$('#loadFill').style.width='48%';const c=await Promise.race([BABYLON.SceneLoader.LoadAssetContainerAsync('https://raw.githubusercontent.com/lord3nd3r/ffxi-browser/main/public/models/','sheep.glb',scene),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),7000))]);template=c;}catch(e){console.warn('sheep fallback',e)}for(let i=0;i<10;i++){let root;if(template){const inst=template.instantiateModelsToScene(n=>n+'_'+i,false,{doNotInstantiate:false});root=inst.rootNodes[0];const minmax=root.getHierarchyBoundingVectors();const h=Math.max(.01,minmax.max.y-minmax.min.y);root.scaling.scaleInPlace((i===9?1.45:1.2)/h);root.getChildMeshes().forEach(m=>{shadow.addShadowCaster(m);if(m.material&&m.material.clone){m.material=m.material.clone('dark'+i);m.material.diffuseColor=new BABYLON.Color3(.09,.075,.055)}});}else root=fallbackSheep(i);do root.position.set(-8+Math.random()*16,0,-7+Math.random()*14);while(!valid(root.position.x,root.position.z));const a={root,index:i,name:i===9?'الفحل صنف':'نجدية '+(i+1),target:new BABYLON.Vector3(),state:'idle',timer:Math.random()*3,speed:.55+Math.random()*.25,hunger:20+Math.random()*40,thirst:20+Math.random()*40,energy:55+Math.random()*40,phase:Math.random()*10};targetFor(a);animals.push(a)}$('#count').textContent=animals.length;$('#loadFill').style.width='78%'}
async function makeTruck(){try{$('#loadText').textContent='تحميل الوايت…';const c=await Promise.race([BABYLON.SceneLoader.LoadAssetContainerAsync('https://raw.githubusercontent.com/KenneyNL/Starter-Kit-Racing/main/models/','vehicle-truck-yellow.glb',scene),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),5000))]);const inst=c.instantiateModelsToScene(n=>n+'_truck',false);truck=inst.rootNodes[0];const mm=truck.getHierarchyBoundingVectors(),h=Math.max(.01,mm.max.y-mm.min.y);truck.scaling.scaleInPlace(2.2/h);truck.position.set(-6,0,8);truck.getChildMeshes().forEach(m=>{shadow.addShadowCaster(m);if(m.material&&m.material.clone){m.material=m.material.clone('whiteTruck');if(m.material.diffuseColor)m.material.diffuseColor=new BABYLON.Color3(.92,.9,.85)}})}catch(e){console.warn('truck fallback',e);truck=new BABYLON.TransformNode('truck',scene);box('tb',4.6,.9,1.9,-6,1,8,mat('tw','#ece8df')).parent=truck;box('tc',1.8,1,1.8,-7,1.8,8,mat('tw2','#ece8df')).parent=truck;truck.position.set(0,0,0)}$('#loadFill').style.width='94%'}
function avoid(a,v){for(const o of obs){const dx=a.root.position.x-o.x,dz=a.root.position.z-o.z;if(Math.abs(dx)<o.hx+1.1&&Math.abs(dz)<o.hz+1.1){const d=new BABYLON.Vector3(dx,0,dz);if(d.lengthSquared()<.001)d.x=.1;v.addInPlace(d.normalize().scale(.8))}}for(const b of animals)if(b!==a){const d=a.root.position.subtract(b.root.position),l=d.length();if(l>0&&l<1.2)v.addInPlace(d.normalize().scale((1.2-l)*.7))}return v}
function updateAnimal(a,dt,t){a.hunger=Math.min(100,a.hunger+dt*.75);a.thirst=Math.min(100,a.thirst+dt*.9);if(a.state==='rest')a.energy=Math.min(100,a.energy+dt*3);else a.energy=Math.max(0,a.energy-dt*.16);if(truck&&truckOn&&BABYLON.Vector3.Distance(a.root.position,truck.position)<4){a.state='startled';a.timer=2.5;const away=a.root.position.subtract(truck.position).normalize().scale(4);a.target=a.root.position.add(away)}if(a.timer<=0){if(a.hunger>62&&food>1){a.state='food';a.target.set(1.7+(a.index%5)*.85,0,-4.1-(a.index>4?2.1:0))}else if(a.thirst>62&&water>1){a.state='water';a.target.set(4.25+(a.index%4)*.7,0,4.05+(a.index>3?2.65:0))}else if(a.energy<24){a.state='rest';a.timer=4+Math.random()*6}else{a.state=Math.random()<.28?'idle':'wander';a.timer=1.5+Math.random()*4;if(a.state==='wander')targetFor(a)}}const moving=['wander','food','water','startled'].includes(a.state);if(moving){let d=a.target.subtract(a.root.position);d.y=0;if(d.length()<.3){if(a.state==='food'){a.state='eat';a.timer=4+Math.random()*3}else if(a.state==='water'){a.state='drink';a.timer=4+Math.random()*2}else{a.timer=0}}else{d.normalize();avoid(a,d);d.normalize();a.root.position.addInPlace(d.scale(a.speed*dt*(a.state==='startled'?1.7:1)));a.root.rotation.y=Math.atan2(d.x,d.z)-Math.PI/2;a.root.position.x=Math.max(-10.2,Math.min(10.2,a.root.position.x));a.root.position.z=Math.max(-9.2,Math.min(9.2,a.root.position.z))}}else{a.timer-=dt;if(a.state==='eat'){a.hunger=Math.max(0,a.hunger-dt*9);food=Math.max(0,food-dt*.7);a.root.rotation.z=.05*Math.sin(t*4+a.phase)}else if(a.state==='drink'){a.thirst=Math.max(0,a.thirst-dt*10);water=Math.max(0,water-dt*.55);a.root.rotation.z=.04*Math.sin(t*4+a.phase)}else if(a.state==='rest'){a.root.rotation.z=.06*Math.sin(t+a.phase)}}}
function ui(){grain.scaling.y=.2+.8*food/100;waterMesh.visibility=.25+.75*water/100;$('#food').textContent=Math.round(food);$('#water').textContent=Math.round(water);$('#feedStock').textContent=stock;if(selected){$('#name').textContent=selected.name;$('#state').textContent=stateText[selected.state]||selected.state;$('#mFood').style.width=(100-selected.hunger)+'%';$('#mWater').style.width=(100-selected.thirst)+'%';$('#mEnergy').style.width=selected.energy+'%'}}function toast(s){const e=$('#toast');e.textContent=s;e.classList.add('on');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('on'),1700)}
$('#feedBtn').onclick=()=>{if(stock<=0)return toast('خلص الشعير');if(food>90)return toast('المعلف ممتلئ');stock--;food=Math.min(100,food+35);toast('عبّيت المعلف 🌾')};$('#waterBtn').onclick=()=>{water=100;toast('عبّيت الماء 💧')};$('#truckBtn').onclick=()=>{truckOn=!truckOn;toast(truckOn?'شغلت الوايت 🛻':'طفيت الوايت')};$('#marketBtn').onclick=()=>toast('السوق تحت التطوير');$('#pet').onclick=()=>{if(selected){selected.energy=Math.min(100,selected.energy+5);toast('تفاعلت مع '+selected.name)}};
scene.onPointerObservable.add(pi=>{if(pi.type!==BABYLON.PointerEventTypes.POINTERPICK||!pi.pickInfo?.hit)return;const m=pi.pickInfo.pickedMesh;if(!m)return;let found=null;for(const a of animals){if(m===a.root||m.isDescendantOf?.(a.root)){found=a;break}}selected=found;$('#animal').classList.toggle('on',!!found);ui()});
let truckPhase=0,acc=0;scene.onBeforeRenderObservable.add(()=>{const dt=Math.min(engine.getDeltaTime()/1000,.04),t=performance.now()/1000;animals.forEach(a=>updateAnimal(a,dt,t));if(truck&&truckOn){truckPhase+=dt*.22;const p=new BABYLON.Vector3(Math.sin(truckPhase)*7,0,7+Math.cos(truckPhase*.7)*1.8),d=p.subtract(truck.position);if(d.length()>.2){d.normalize();truck.position.addInPlace(d.scale(1.4*dt));truck.rotation.y=Math.atan2(d.x,d.z)-Math.PI/2}}acc+=dt;if(acc>.15){acc=0;ui()}});
(async()=>{try{$('#loadFill').style.width='22%';await makeFlock();await makeTruck();$('#loadText').textContent='العزبة جاهزة';$('#loadFill').style.width='100%';setTimeout(()=>{const l=$('#loading');l.style.opacity='0';setTimeout(()=>l.remove(),350)},350)}catch(e){console.error(e);$('#loadText').textContent='حصل خطأ، لكن المحرك سيكمل بالنسخة الاحتياطية';setTimeout(()=>$('#loading')?.remove(),1200)}})();engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());})();
</script></body></html>
