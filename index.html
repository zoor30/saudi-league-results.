<script>
(()=>{'use strict';
const C=document.getElementById('game'),G=C.getContext('2d',{alpha:false,desynchronized:true}),M=document.getElementById('mini'),MG=M.getContext('2d');const $=s=>document.querySelector(s),TAU=Math.PI*2,WORLD={w:2400,h:1900};let DPR=1,VW=0,VH=0,seed=0x91a27b3;const coins=$('#coins'),level=$('#level'),feed=$('#feed'),hay=$('#hay'),count=$('#count'),clock=$('#clock'),quest=$('#quest'),panel=$('#panel'),pname=$('#pname'),pstate=$('#pstate'),ph=$('#ph'),pt=$('#pt'),pe=$('#pe'),ps=$('#ps'),pet=$('#pet'),feedBtn=$('#feedBtn'),waterBtn=$('#waterBtn'),truckBtn=$('#truckBtn'),marketBtn=$('#marketBtn'),homeBtn=$('#homeBtn'),market=$('#market'),closeMarket=$('#closeMarket');const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296),rr=(a,b)=>a+rnd()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const cam={x:1120,y:1030,z:1.0,tx:1120,ty:1030,tz:1.0};const S={coins:850,feed:10,hay:8,water:100,food:52,level:1,xp:0,day:1,time:7*60,feeds:0,truck:false,selected:null};try{const q=JSON.parse(localStorage.getItem('wadiNajdSave')||'null');if(q&&q.v===2){Object.assign(S,q.s||{});cam.x=cam.tx=q.cx||cam.x;cam.y=cam.ty=q.cy||cam.y}}catch{}function save(){try{localStorage.setItem('wadiNajdSave',JSON.stringify({v:2,s:{coins:S.coins,feed:S.feed,hay:S.hay,water:S.water,food:S.food,level:S.level,xp:S.xp,day:S.day,time:S.time,feeds:S.feeds},cx:cam.x,cy:cam.y}))}catch{}}setInterval(save,5000);
const terrain=document.createElement('canvas');terrain.width=WORLD.w;terrain.height=WORLD.h;const T=terrain.getContext('2d');function blob(g,x,y,r,c,n=20){g.fillStyle=c;g.beginPath();for(let i=0;i<n;i++){const a=i/n*TAU,rad=r*(.78+rr(0,.36)),px=x+Math.cos(a)*rad,py=y+Math.sin(a)*rad;i?g.lineTo(px,py):g.moveTo(px,py)}g.closePath();g.fill()}

98683b':'#815730';T.fillRect(x,-90,22,180);T.strokeStyle='#36241666';T.strokeRect(x,-90,22,180)}T.restore();for(let i=0;i<2500;i++){const x=rr(10,2390),y=rr(10,1890);if(x>1780)continue;T.fillStyle=rnd()<.055?(rnd()<.5?'#f4e3a9':'#d8c9ef'):(rnd()<.17?'#80a84d':'#234f29');const s=rr(1,3);T.fillRect(x,y,s,s*1.8)}}buildTerrain();
const trees=[],bushes=[],rocks=[],flowers=[],birds=[];function pushSafe(arr,n,maker){for(let i=0;i<n;i++){let o;for(let k=0;k<30;k++){o=maker();if(!(o.x>1740&&o.x<2340)&&Math.hypot(o.x-1030,o.y-1040)>250)break}arr.push(o)}}pushSafe(trees,125,()=>({x:rr(50,2330),y:rr(330,1850),s:rr(.65,1.4),p:rr(0,TAU),palm:rnd()<.12}));pushSafe(bushes,170,()=>({x:rr(40,2340),y:rr(320,1850),s:rr(.55,1.2),p:rr(0,TAU)}));pushSafe(rocks,90,()=>({x:rr(50,2350),y:rr(280,1840),s:rr(.55,1.3)}));for(let i=0;i<120;i++)flowers.push({x:rr(100,1700),y:rr(380,1780),c:rnd()<.5?'#efe3ac':'#d8c7ef'});for(let i=0;i<7;i++)birds.push({x:rr(400,2100),y:rr(380,900),p:rr(0,TAU),s:rr(.7,1.2)});
function tree(o,t){G.save();G.translate(o.x,o.y);G.scale(o.s,o.s);let sw=Math.sin(t*1.15+o.p)*2.2;G.fillStyle='#10281755';G.beginPath();G.ellipse(14,23,38,17,.15,0,TAU);G.fill();G.fillStyle='#684728';G.fillRect(-5,0,10,42);if(o.palm){for(let k=0;k<8;k++){G.strokeStyle=k%2?'#386f37':'#2e6131';G.lineWidth=9;G.beginPath();G.moveTo(0,0);let a=k/8*TAU;G.quadraticCurveTo(Math.cos(a)*24+sw,-25+Math.sin(a)*8,Math.cos(a)*45+sw,-15+Math.sin(a)*17);G.stroke()}}else{const cs=['#194922','#2e6b32','#418344'];for(let k=0;k<8;k++){let a=k/8*TAU,r=k<3?20:31;G.fillStyle=cs[k%3];G.beginPath();G.arc(Math.cos(a)*r+sw,-12+Math.sin(a)*r*.52,25,0,TAU);G.fill()}}G.restore()}function bush(o,t){G.save();G.translate(o.x,o.y);G.scale(o.s,o.s);G.fillStyle='#15391f66';G.beginPath();G.ellipse(6,8,24,12,0,0,TAU);G.fill();for(let k=0;k<6;k++){G.fillStyle=k%2?'#32713a':'#3f8241';G.beginPath();G.arc(Math.cos(k*1.1)*14+Math.sin(t+o.p)*.7,Math.sin(k*1.1)*8,13,0,TAU);G.fill()}G.restore()}function rock(o){G.save();G.translate(o.x,o.y);G.scale(o.s,o.s);G.fillStyle='#26332644';G.beginPath();G.ellipse(7,10,27,12,0,0,TAU);G.fill();G.fillStyle='#8c9180';G.beginPath();G.moveTo(-22,8);G.lineTo(-11,-15);G.lineTo(8,-22);G.lineTo(25,-4);G.lineTo(14,15);G.closePath();G.fill();G.fillStyle='#a7aa95';G.beginPath();G.moveTo(-11,-15);G.lineTo(8,-22);G.lineTo(17,-8);G.lineTo(0,-7);G.closePath();G.fill();G.restore()}function shadow(x,y,rx,ry){G.fillStyle='#0b271955';G.beginPath();G.ellipse(x+7,y+10,rx,ry,0,0,TAU);G.fill()}

function drawTent(){let {x,y}=props.tent;shadow(x,y,90,35);G.fillStyle='#9b7348';G.beginPath();G.moveTo(x-80,y+30);G.lineTo(x,y-85);G.lineTo(x+80,y+30);G.closePath();G.fill();G.fillStyle='#c49b68';G.beginPath();G.moveTo(x,y-85);G.lineTo(x+80,y+30);G.lineTo(x+25,y+30);G.lineTo(x,y-45);G.closePath();G.fill();G.fillStyle='#432e20';G.fillRect(x-17,y-9,34,39)}function drawWell(){let {x,y}=props.well;shadow(x,y,55,25);G.fillStyle='#7c796c';G.beginPath();G.ellipse(x,y,50,24,0,0,TAU);G.fill();G.fillStyle='#4e5551';G.beginPath();G.ellipse(x,y-7,39,16,0,0,TAU);G.fill();G.fillStyle='#388da3';G.beginPath();G.ellipse(x,y-9,31,11,0,0,TAU);G.fill();G.strokeStyle='#67472c';G.lineWidth=7;G.beginPath();G.moveTo(x-43,y-15);G.lineTo(x-43,y-73);G.lineTo(x+43,y-73);G.lineTo(x+43,y-15);G.stroke()}function drawFeeder(){let p=props.feeder;shadow(p.x,p.y,105,25);G.fillStyle='#58432e';G.roundRect(p.x-p.w/2,p.y-p.h/2,p.w,p.h,8);G.fill();G.fillStyle='#d5ad41';G.roundRect(p.x-p.w/2+16,p.y-15,p.w-32,24,6);G.fill();G.strokeStyle='#302619';G.lineWidth=4;G.strokeRect(p.x-p.w/2+4,p.y-p.h/2+4,p.w-8,p.h-8)}function drawTrough(){let p=props.trough;shadow(p.x,p.y,80,25);G.fillStyle='#596663';G.roundRect(p.x-p.w/2,p.y-p.h/2,p.w,p.h,9);G.fill();G.fillStyle='#4da7bd';G.roundRect(p.x-p.w/2+11,p.y-15,p.w-22,24,6);G.fill();G.strokeStyle='#b4dde0';G.lineWidth=2;G.beginPath();G.moveTo(p.x-p.w/2+20,p.y-7);G.quadraticCurveTo(p.x,p.y,p.x+p.w/2-20,p.y-7);G.stroke()}function drawCamp(t){let {x,y}=props.camp;shadow(x,y,45,20);for(let i=0;i<8;i++){let a=i/8*TAU;G.fillStyle='#777467';G.beginPath();G.arc(x+Math.cos(a)*30,y+Math.sin(a)*13,8,0,TAU);G.fill()}for(let i=0;i<4;i++){G.fillStyle=i%2?'#ff9925':'#ffe15a';G.beginPath();G.moveTo(x-14+i*8,y+5);G.quadraticCurveTo(x+Math.sin(t*5+i)*12,y-50-i*3,x+15-i*6,y+5);G.closePath();G.fill()}}
function drawTruck(t){let x=1490+Math.sin(t*.16)*240,y=1460+Math.cos(t*.22)*65;if(!S.truck){x=1580;y=1470}S.truckX=x;S.truckY=y;shadow(x,y,75,30);G.save();G.translate(x,y);G.rotate(-.16+Math.sin(t*.12)*.08);G.fillStyle='#ede9df';G.roundRect(-80,-33,160,66,9);G.fill();G.fillStyle='#d7d2c7';G.fillRect(20,-29,48,58);G.fillStyle='#6d9da7';G.fillRect(-54,-27,42,19);G.fillStyle='#4a4d49';G.fillRect(-87,-18,9,36);G.fillStyle='#1d1d1c';for(let xx of[-48,48])for(let yy of[-36,36]){G.beginPath();G.arc(xx,yy,10,0,TAU);G.fill()}G.fillStyle='#c9c6bf';G.fillRect(-88,-28,6,18);G.fillStyle='#a52d25';G.fillRect(74,-21,5,12);G.restore()}
const animals=[];const pers=['هادية','فضولية','اجتماعية','شرهة','نشيطة','حذرة'];for(let i=0;i<10;i++){let a={id:i,name:i===9?'الفحل صنف':'نجدية '+(i+1),ram:i===9,x:rr(720,1320),y:rr(720,1210),tx:0,ty:0,vx:0,vy:0,speed:rr(28,42),state:'idle',timer:rr(0,3),hunger:rr(18,56),thirst:rr(15,50),energy:rr(60,95),social:rr(45,90),p:rr(0,TAU),personality:pers[i%pers.length]};chooseTarget(a);animals.push(a)}function validPoint(x,y){if(x<560||x>1530||y<650||y>1430)return false;for(let o of obstacles)if(Math.hypot(x-o.x,y-o.y)<o.r)return false;return true}function chooseTarget(a){for(let k=0;k<25;k++){let x=rr(600,1480),y=rr(700,1390);if(validPoint(x,y)){a.tx=x;a.ty=y;return}}a.tx=1050;a.ty=980}function decide(a){if(a.hunger>65&&S.food>2){a.state='food';a.tx=props.feeder.x+rr(-65,65);a.ty=props.feeder.y-rr(60,85);return}if(a.thirst>62&&S.water>2){a.state='water';a.tx=props.trough.x+rr(-50,50);a.ty=props.trough.y-rr(55,75);return}if(a.energy<25){a.state='rest';a.timer=rr(5,9);return}let r=rnd();if(r<.23){a.state='idle';a.timer=rr(1.5,4)}else if(r<.32){a.state='graze';a.timer=rr(2.5,5)}else{a.state='wander';chooseTarget(a)}}function herdSeparation(a){let sx=0,sy=0;for(let q of animals){if(q===a)continue;let dx=a.x-q.x,dy=a.y-q.y,d=Math.hypot(dx,dy);if(d&&d<54){sx+=dx/d*(54-d);sy+=dy/d*(54-d)}}return [sx,sy]}function moveAnimal(a,dt){let dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);if(d<8)return true;let [sx,sy]=herdSeparation(a),nx=dx/d+sx*.015,ny=dy/d+sy*.015,nl=Math.hypot(nx,ny)||1;nx/=nl;ny/=nl;a.vx+=(nx*a.speed-a.vx)*.12;a.vy+=(ny*a.speed-a.vy)*.12;a.x+=a.vx*dt;a.y+=a.vy*dt;return false}function updateAnimal(a,dt){a.hunger=clamp(a.hunger+dt*.65,0,100);a.thirst=clamp(a.thirst+dt*.82,0,100);if(['wander','food','water','flee'].includes(a.state))a.energy=clamp(a.energy-dt*.16,0,100);else if(a.state==='rest')a.energy=clamp(a.energy+dt*3,0,100);if(S.truck&&Math.hypot(a.x-S.truckX,a.y-S.truckY)<170){a.state='flee';let dx=a.x-S.truckX,dy=a.y-S.truckY,d=Math.hypot(dx,dy)||1;a.tx=clamp(a.x+dx/d*180,590,1500);a.ty=clamp(a.y+dy/d*180,690,1400);a.timer=1.7}if(['wander','food','water','flee'].includes(a.state)){if(moveAnimal(a,dt)){if(a.state==='food'){a.state='eat';a.timer=rr(4,6)}else if(a.state==='water'){a.state='drink';a.timer=rr(3,5)}else if(a.state==='flee'){a.state='idle';a.timer=1}else decide(a)}}else if(a.state==='eat'){a.timer-=dt;a.hunger=clamp(a.hunger-dt*10,0,100);S.food=clamp(S.food-dt*.55,0,100);if(a.timer<=0||a.hunger<15)decide(a)}else if(a.state==='drink'){a.timer-=dt;a.thirst=clamp(a.thirst-dt*12,0,100);S.water=clamp(S.water-dt*.5,0,100);if(a.timer<=0||a.thirst<12)decide(a)}else if(a.state==='rest'){a.timer-=dt;if(a.timer<=0||a.energy>85)decide(a)}else{a.timer-=dt;if(a.timer<=0)decide(a)}}function drawAnimal(a,t){shadow(a.x,a.y,a.ram?34:28,13);let ang=Math.atan2(a.vy,a.vx),moving=Math.hypot(a.vx,a.vy)>5,step=Math.sin(t*8+a.p)*(moving?6:1.2),headDip=(a.state==='eat'||a.state==='drink'||a.state==='graze')?12+Math.sin(t*4+a.p)*3:0;G.save();G.translate(a.x,a.y);G.rotate(ang||0);let sc=a.ram?1.12:1;G.scale(sc,sc);G.strokeStyle='#171410';G.lineWidth=7;for(let x of[-18,17])for(let y of[-11,11]){G.beginPath();G.moveTo(x,y);G.lineTo(x+(y>0?step:-step),y+18);G.stroke()}G.fillStyle='#211d19';G.beginPath();G.ellipse(0,0,32,19,0,0,TAU);G.fill();G.fillStyle='#171411';G.beginPath();G.ellipse(31,headDip-2,13,17,0,0,TAU);G.fill();for(let s of[-1,1]){G.strokeStyle='#171411';G.lineWidth=6;G.beginPath();G.moveTo(34,headDip-8);G.quadraticCurveTo(40,headDip-18*s,48,headDip-14*s);G.stroke()}if(a.ram){G.strokeStyle='#c5a46a';G.lineWidth=4;for(let s of[-1,1]){G.beginPath();G.arc(29,headDip-5,11,-1.2,1.8*s);G.stroke()}}G.fillStyle='#d8c26f';G.beginPath();G.arc(39,headDip-6,2.4,0,TAU);G.fill();G.restore()}
const fx=[];function spark(x,y,c='#ffe061'){for(let i=0;i<5;i++)fx.push({x,y,vx:rr(-15,15),vy:rr(-40,-15),t:rr(.4,.8),c})}function puff(x,y){for(let i=0;i<3;i++)fx.push({x:x+rr(-8,8),y:y+rr(-5,5),vx:rr(-10,10),vy:rr(-15,-5),t:rr(.4,.7),c:'#c8aa76'})}let audio=null;function audioOn(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)()}catch{}}function bleat(){try{audioOn();let o=audio.createOscillator(),g=audio.createGain();o.type='sawtooth';o.frequency.setValueAtTime(rr(160,210),audio.currentTime);o.frequency.exponentialRampToValueAtTime(rr(110,145),audio.currentTime+.28);g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.035,audio.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.35);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.36)}catch{}}function toast(s){let e=$('#toast');e.textContent=s;e.classList.add('on');clearTimeout(window.to);window.to=setTimeout(()=>e.classList.remove('on'),1800)}function xp(n){S.xp+=n;let need=100+S.level*60;if(S.xp>=need){S.xp-=need;S.level++;S.coins+=150;toast('وصلت المستوى '+S.level+' ⭐')}}
function updateUI(){coins.textContent=Math.floor(S.coins);level.textContent=S.level;feed.textContent=S.feed;hay.textContent=S.hay;count.textContent=animals.length;let hr=Math.floor(S.time/60)%24,mn=Math.floor(S.time%60);clock.textContent=`اليوم ${S.day} • ${hr>12?hr-12:hr||12}:${String(mn).padStart(2,'0')} ${hr>=12?'م':'ص'}`;quest.textContent=`مهمة اليوم: أطعم القطيع 3 مرات (${Math.min(S.feeds,3)}/3)`;quest.classList.toggle('done',S.feeds>=3);if(S.selected){let a=S.selected;pname.textContent=a.name;pstate.textContent=a.personality+' • '+({wander:'يتمشى',idle:'يتلفّت',graze:'يرعى',food:'رايح للمعلف',eat:'يأكل',water:'رايح للماء',drink:'يشرب',rest:'يرتاح',flee:'مفزوع من الوايت'}[a.state]||a.state);ph.style.width=(100-a.hunger)+'%';pt.style.width=(100-a.thirst)+'%';pe.style.width=a.energy+'%';ps.style.width=a.social+'%'}}feedBtn.onclick=()=>{audioOn();if(S.feed<=0)return toast('ما عندك شعير');if(S.food>=95)return toast('المعلف ممتلئ');S.feed--;S.food=clamp(S.food+38,0,100);S.feeds++;xp(12);spark(props.feeder.x,props.feeder.y,'#d9b547');toast('عبّيت المعلف 🌾');if(S.feeds===3){S.coins+=120;toast('أنجزت مهمة اليوم +120 🪙')}};waterBtn.onclick=()=>{audioOn();S.water=100;xp(4);toast('عبّيت حوض الماء 💧')};truckBtn.onclick=()=>{audioOn();S.truck=!S.truck;toast(S.truck?'شغلت الوايت 🛻':'وقفت الوايت')};marketBtn.onclick=()=>market.classList.add('on');homeBtn.onclick=()=>{cam.tx=1030;cam.ty=1060;cam.tz=1.12;toast('رجعنا للمخيم 🏕️')};closeMarket.onclick=()=>market.classList.remove('on');market.addEventListener('click',e=>{if(e.target===market)market.classList.remove('on')});document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let k=b.dataset.buy,c=k==='feed'?80:k==='hay'?110:50;if(S.coins<c)return toast('العملات ما تكفي');S.coins-=c;if(k==='feed')S.feed+=5;if(k==='hay')S.hay+=5;if(k==='water')S.water=100;xp(5);toast('تم الشراء');updateUI()});pet.onclick=()=>{if(!S.selected)return;S.selected.social=clamp(S.selected.social+12,0,100);bleat();xp(2);toast('ألفت '+S.selected.name+' عليك 🤚')};
let points=new Map(),last=null,lastDist=0,down=null;C.addEventListener('pointerdown',e=>{audioOn();C.setPointerCapture(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});down={x:e.clientX,y:e.clientY}});C.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;points.set(e.pointerId,{x:e.clientX,y:e.clientY});let a=[...points.values()];if(a.length===1){if(last){cam.tx-=(a[0].x-last.x)/cam.z;cam.ty-=(a[0].y-last.y)/cam.z;cam.tx=clamp(cam.tx,VW/(2*cam.z),WORLD.w-VW/(2*cam.z));cam.ty=clamp(cam.ty,VH/(2*cam.z),WORLD.h-VH/(2*cam.z))}last={...a[0]}}else if(a.length>=2){let d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastDist)cam.tz=clamp(cam.tz+(d-lastDist)*.0025,.58,1.65);lastDist=d}});function end(e){if(down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<10){let wx=(e.clientX-VW/2)/cam.z+cam.x,wy=(e.clientY-VH/2)/cam.z+cam.y,best=null,bd=999;for(let a of animals){let d=Math.hypot(wx-a.x,wy-a.y);if(d<bd&&d<45){bd=d;best=a}}S.selected=best;panel.classList.toggle('on',!!best);if(best){bleat();updateUI()}}points.delete(e.pointerId);last=null;lastDist=0;down=null}C.addEventListener('pointerup',end);C.addEventListener('pointercancel',end);
function drawMini(){MG.clearRect(0,0,156,156);MG.fillStyle='#315f38';MG.fillRect(0,0,156,156);MG.fillStyle='#4b9eaa';MG.fillRect(124,0,32,156);MG.fillStyle='#b99a61';MG.fillRect(0,0,156,25);MG.fillStyle='#e7be53';MG.beginPath();MG.arc(props.camp.x/WORLD.w*156,props.camp.y/WORLD.h*156,3,0,TAU);MG.fill();MG.fillStyle='#171512';for(let a of animals)MG.fillRect(a.x/WORLD.w*156,a.y/WORLD.h*156,2,2);MG.strokeStyle='#fff';MG.strokeRect((cam.x-VW/(2*cam.z))/WORLD.w*156,(cam.y-VH/(2*cam.z))/WORLD.h*156,VW/cam.z/WORLD.w*156,VH/cam.z/WORLD.h*156)}
function drawWorld(t,dt){let left=cam.x-VW/(2*cam.z),top=cam.y-VH/(2*cam.z),sw=VW/cam.z,sh=VH/cam.z;G.save();G.translate(VW/2,VH/2);G.scale(cam.z,cam.z);G.translate(-cam.x,-cam.y);G.drawImage(terrain,left,top,sw,sh,left,top,sw,sh);let dyn=[];for(let o of trees)if(o.x>left-100&&o.x<left+sw+100&&o.y>top-130&&o.y<top+sh+130)dyn.push({y:o.y,f:()=>tree(o,t)});for(let o of bushes)if(o.x>left-60&&o.x<left+sw+60&&o.y>top-60&&o.y<top+sh+60)dyn.push({y:o.y,f:()=>bush(o,t)});for(let o of rocks)if(o.x>left-60&&o.x<left+sw+60&&o.y>top-60&&o.y<top+sh+60)dyn.push({y:o.y,f:()=>rock(o)});for(let f of flowers)if(f.x>left&&f.x<left+sw&&f.y>top&&f.y<top+sh)dyn.push({y:f.y,f:()=>{G.fillStyle=f.c;G.beginPath();G.arc(f.x,f.y,2.5,0,TAU);G.fill()}});dyn.push({y:props.tent.y,f:drawTent},{y:props.well.y,f:drawWell},{y:props.feeder.y,f:drawFeeder},{y:props.trough.y,f:drawTrough},{y:props.camp.y,f:()=>drawCamp(t)});for(let a of animals)dyn.push({y:a.y,f:()=>drawAnimal(a,t)});dyn.push({y:S.truckY||1470,f:()=>drawTruck(t)});dyn.sort((a,b)=>a.y-b.y);for(let d of dyn)d.f();G.strokeStyle='#19231d88';G.lineWidth=2;for(let b of birds){let x=b.x+Math.sin(t*.13+b.p)*130,y=b.y+Math.cos(t*.11+b.p)*35;G.beginPath();G.moveTo(x-8*b.s,y);G.quadraticCurveTo(x-3*b.s,y-6*b.s,x,y);G.quadraticCurveTo(x+3*b.s,y-6*b.s,x+8*b.s,y);G.stroke()}for(let i=fx.length-1;i>=0;i--){let p=fx[i];p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=12*dt;G.globalAlpha=clamp(p.t/.7,0,1);G.fillStyle=p.c;G.beginPath();G.arc(p.x,p.y,3+p.t*3,0,TAU);G.fill();G.globalAlpha=1;if(p.t<=0)fx.splice(i,1)}G.restore();let hour=(S.time/60)%24,night=Math.max(0,Math.min(1,Math.abs(hour-12)/8-.55));if(night>0){G.fillStyle=`rgba(14,28,48,${night*.42})`;G.fillRect(0,0,VW,VH)}}
let lastT=performance.now(),uiT=0;function loop(now){requestAnimationFrame(loop);let dt=Math.min((now-lastT)/1000,.04);lastT=now;S.time+=dt*1.5;if(S.time>=1440){S.time-=1440;S.day++;S.feeds=0;toast('بدأ يوم جديد 🌅')}for(let a of animals)updateAnimal(a,dt);if(S.truck&&rnd()<dt*5)puff(S.truckX,S.truckY);if(rnd()<dt*1.2)spark(props.camp.x,props.camp.y);cam.x+=(cam.tx-cam.x)*.09;cam.y+=(cam.ty-cam.y)*.09;cam.z+=(cam.tz-cam.z)*.08;drawWorld(now/1000,dt);uiT+=dt;if(uiT>.15){uiT=0;updateUI();drawMini()}}requestAnimationFrame(loop);updateUI();
})();
