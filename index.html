<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>عزبة نجد</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#94d3ea;font-family:system-ui,-apple-system,sans-serif;touch-action:none}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between}.card{background:#4d321fe8;color:#fff;border:2px solid #f2d39b88;border-radius:15px;padding:8px 12px;box-shadow:0 5px 15px #0004;font-weight:800}.brand{font-size:18px}.stats{font-size:12px;line-height:1.7}.bottom{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));left:8px;right:8px;display:flex;gap:7px;justify-content:center;pointer-events:auto}.btn{border:2px solid #fff7;border-radius:16px;padding:10px 12px;background:linear-gradient(#ffd96f,#d9972e);box-shadow:0 4px 0 #81501d,0 8px 16px #0003;font-weight:900;color:#472b14}.toast{position:absolute;bottom:86px;left:50%;transform:translateX(-50%);background:#2f251de8;color:#fff;padding:9px 14px;border-radius:13px;opacity:0;transition:.2s;white-space:nowrap}.toast.on{opacity:1}.loading{position:absolute;top:86px;left:50%;transform:translateX(-50%);background:#fffde8;color:#4b321f;padding:8px 13px;border-radius:14px;font-weight:800;box-shadow:0 4px 12px #0002}</style></head><body><div id="game"></div><div class="hud"><div class="top"><div class="card brand">عزبة نجد 🐑</div><div class="card stats">المستوى 1<br>🪙 850　🌾 <span id="feed">12</span><br>القطيع <span id="count">0</span>/10</div></div><div id="loading" class="loading">جاري تحميل الموديلات 3D…</div><div id="toast" class="toast"></div><div class="bottom"><button class="btn" id="feedBtn">🌾 علف</button><button class="btn" id="waterBtn">💧 ماء</button><button class="btn" id="truckBtn">🛻 الوايت</button><button class="btn" id="marketBtn">📰 السوق</button></div></div><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.169.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
const SHEEP_URL='https://raw.githubusercontent.com/lord3nd3r/ffxi-browser/main/public/models/sheep.glb';
const TRUCK_URL='https://raw.githubusercontent.com/KenneyNL/Starter-Kit-Racing/main/models/vehicle-truck-yellow.glb';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x94d3ea);scene.fog=new THREE.FogExp2(0xc7d8d1,.013);
const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,130);camera.position.set(13,18,22);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;document.querySelector('#game').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff0cd,0x806040,2.5));const sun=new THREE.DirectionalLight(0xffdda7,4.2);sun.position.set(-14,24,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-30;sun.shadow.camera.right=30;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;scene.add(sun);
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});function make(geo,c,p=[0,0,0],r=.8,m=0){const o=new THREE.Mesh(geo,mat(c,r,m));o.position.set(...p);o.castShadow=o.receiveShadow=true;scene.add(o);return o}
const ground=make(new THREE.PlaneGeometry(90,90),0xd2ad6d);ground.rotation.x=-Math.PI/2;for(let i=0;i<70;i++){const d=make(new THREE.CircleGeometry(.18+Math.random()*.65,10),Math.random()>.5?0xba8c4d:0xe2c080,[(Math.random()-.5)*45,.012,(Math.random()-.5)*45]);d.rotation.x=-Math.PI/2;d.scale.y=.45}
// enclosure
for(let x=-12;x<=12;x+=1.5){make(new THREE.CylinderGeometry(.08,.1,1.55,8),0x72583d,[x,.78,-11]);make(new THREE.CylinderGeometry(.08,.1,1.55,8),0x72583d,[x,.78,11])}for(let z=-9.5;z<=9.5;z+=1.5){make(new THREE.CylinderGeometry(.08,.1,1.55,8),0x72583d,[-12,.78,z]);make(new THREE.CylinderGeometry(.08,.1,1.55,8),0x72583d,[12,.78,z])}for(const z of [-11,11])for(const y of [.4,.85,1.28])make(new THREE.BoxGeometry(24,.055,.055),0x62605a,[0,y,z],.45,.55);for(const x of [-12,12])for(const y of [.4,.85,1.28])make(new THREE.BoxGeometry(.055,.055,22),0x62605a,[x,y,0],.45,.55);
// shade + feeders
for(const x of [-8,-1])for(const z of [-7,-2])make(new THREE.CylinderGeometry(.09,.11,3.2,8),0x6d5942,[x,1.6,z]);const roof=make(new THREE.BoxGeometry(7.7,.12,5.8),0x516a59,[-4.5,3.2,-4.5]);roof.rotation.z=-.025;make(new THREE.BoxGeometry(5.7,.5,1.15),0x8a8071,[3.4,.27,-5.2]);make(new THREE.BoxGeometry(5.25,.12,.78),0xc89c3d,[3.4,.55,-5.2]);make(new THREE.BoxGeometry(3.4,.55,1.45),0x777e7d,[5.4,.3,5.4],.45,.6);make(new THREE.BoxGeometry(3.05,.05,1.08),0x3e9fc4,[5.4,.59,5.4],.18,.1);for(let i=0;i<5;i++){let h=make(new THREE.CylinderGeometry(.65,.65,1.1,20),0xd0a12d,[-8+i*1.2,.68,7]);h.rotation.z=Math.PI/2}
const loader=new GLTFLoader(),sheep=[],mixers=[];let sheepSource=null,sheepAnims=[],truck=null,truckTarget=null;
function shadows(root){root.traverse(o=>{if(o.isMesh||o.isSkinnedMesh){o.castShadow=o.receiveShadow=true;o.frustumCulled=false}})}
function normalize(root,targetHeight){root.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(root),h=Math.max(.001,b.max.y-b.min.y);root.scale.multiplyScalar(targetHeight/h);root.updateMatrixWorld(true);const b2=new THREE.Box3().setFromObject(root);root.position.y-=b2.min.y}
function blackNajdi(root,ram=false){root.traverse(o=>{if(o.isMesh||o.isSkinnedMesh){if(Array.isArray(o.material))o.material=o.material.map(x=>x.clone());else o.material=o.material.clone();const arr=Array.isArray(o.material)?o.material:[o.material];arr.forEach(mm=>{if(mm.color){const lum=mm.color.r+mm.color.g+mm.color.b;if(lum>1.25)mm.color.set(ram?0x211d18:0x2a251f);else mm.color.multiplyScalar(.35);mm.roughness=Math.max(mm.roughness??.7,.68)}})}})}
function pick(s){s.userData.target.set(-8+Math.random()*16,0,-8+Math.random()*16);s.userData.wait=1+Math.random()*4;s.userData.state='wander'}
function spawnSheep(i){const ram=i===9,rig=SkeletonUtils.clone(sheepSource);blackNajdi(rig,ram);shadows(rig);normalize(rig,ram?1.42:1.18);rig.scale.multiplyScalar(.9+Math.random()*.08);rig.position.x=-7+Math.random()*13;rig.position.z=-7+Math.random()*12;rig.rotation.y=Math.random()*Math.PI*2;rig.userData={target:new THREE.Vector3(),wait:1,state:'wander',speed:.58+Math.random()*.25,ram};scene.add(rig);pick(rig);if(sheepAnims.length){const mx=new THREE.AnimationMixer(rig);let walk=sheepAnims.find(a=>/walk|run/i.test(a.name))||sheepAnims[0];mx.clipAction(walk).play();rig.userData.mixer=mx;mixers.push(mx)}sheep.push(rig);document.querySelector('#count').textContent=sheep.length}
loader.load(SHEEP_URL,g=>{sheepSource=g.scene;sheepAnims=g.animations||[];for(let i=0;i<10;i++)spawnSheep(i);doneLoading()},undefined,e=>{console.error(e);document.querySelector('#loading').textContent='تعذر تحميل موديل النجديات'});
loader.load(TRUCK_URL,g=>{truck=g.scene;shadows(truck);normalize(truck,2.0);truck.traverse(o=>{if(o.isMesh){o.material=o.material.clone();const n=(o.name||'').toLowerCase();if(n.includes('body')){o.material.color.set(0xeeeae0);o.material.roughness=.52}else if(n.includes('wheel')){o.material.roughness=.82}}});truck.scale.multiplyScalar(1.65);truck.position.set(-6,0,8);truck.rotation.y=-.35;scene.add(truck);doneLoading()},undefined,e=>{console.error(e);document.querySelector('#loading').textContent='تعذر تحميل موديل الوايت'});
let loaded=0;function doneLoading(){loaded++;if(loaded>=2)setTimeout(()=>document.querySelector('#loading').remove(),500)}
let feed=12;const toast=t=>{const e=document.querySelector('#toast');e.textContent=t;e.classList.add('on');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('on'),1800)};
document.querySelector('#feedBtn').onclick=()=>{if(!sheep.length)return toast('الموديلات ما اكتملت');if(!feed)return toast('العلف خلص');document.querySelector('#feed').textContent=--feed;sheep.forEach((s,i)=>{s.userData.target.set(1.5+(i%5)*.8,0,-4.35+Math.floor(i/5)*.55);s.userData.state='eat'});toast('النجديات متجهة للمعلف')};document.querySelector('#waterBtn').onclick=()=>{sheep.forEach((s,i)=>{s.userData.target.set(4.2+(i%4)*.65,0,4.2+Math.floor(i/4)*.5);s.userData.state='drink'});toast('القطيع متجه للماء')};document.querySelector('#truckBtn').onclick=()=>{if(!truck)return toast('الوايت ما اكتمل تحميله');truckTarget=truckTarget?null:new THREE.Vector3(7,0,7);toast(truckTarget?'شغلت الوايت 🛻':'طفيت الوايت')};document.querySelector('#marketBtn').onclick=()=>toast('السوق تحت التطوير');
let pointers=new Map(),last=null,lastD=0,target=new THREE.Vector3(),zoom=1;renderer.domElement.onpointerdown=e=>{renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY})};renderer.domElement.onpointermove=e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=[...pointers.values()];if(a.length===1){if(last){target.x-=(a[0].x-last.x)*.017*zoom;target.z-=(a[0].y-last.y)*.017*zoom;target.x=THREE.MathUtils.clamp(target.x,-8,8);target.z=THREE.MathUtils.clamp(target.z,-8,8)}last={...a[0]}}else{const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastD)zoom=THREE.MathUtils.clamp(zoom-(d-lastD)*.004,.58,1.5);lastD=d}};const up=e=>{pointers.delete(e.pointerId);last=null;lastD=0};renderer.domElement.onpointerup=up;renderer.domElement.onpointercancel=up;
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);for(const s of sheep){const u=s.userData,d=u.target.clone().sub(s.position);d.y=0;if(d.length()>.32){d.normalize();s.position.addScaledVector(d,u.speed*dt);s.rotation.y=THREE.MathUtils.lerp(s.rotation.y,Math.atan2(d.x,d.z)-Math.PI/2,.085);if(u.mixer)u.mixer.timeScale=1.1}else{if(u.mixer)u.mixer.timeScale=.22;if(u.state==='wander'&&(u.wait-=dt)<0)pick(s)}}mixers.forEach(m=>m.update(dt));if(truck&&truckTarget){const d=truckTarget.clone().sub(truck.position);d.y=0;if(d.length()>.45){d.normalize();truck.position.addScaledVector(d,1.6*dt);truck.rotation.y=THREE.MathUtils.lerp(truck.rotation.y,Math.atan2(d.x,d.z)-Math.PI/2,.06)}else truckTarget=truck.position.x>0?new THREE.Vector3(-6,0,8):new THREE.Vector3(7,0,7)}const cp=new THREE.Vector3(target.x+13*zoom,18*zoom,target.z+22*zoom);camera.position.lerp(cp,.055);camera.lookAt(target);renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
