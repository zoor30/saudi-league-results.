const scene=new THREE.Scene();scene.background=new THREE.Color(0x94d3ea);scene.fog=new THREE.FogExp2(0xc7d8d1,.013);const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,130);camera.position.set(13,18,22);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;document.querySelector('#game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xfff0cd,0x806040,2.5));const sun=new THREE.DirectionalLight(0xffdda7,4.2);sun.position.set(-14,24,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30});scene.add(sun);
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});function make(geo,c,p=[0,0,0],r=.8,m=0){const o=new THREE.Mesh(geo,mat(c,r,m));o.position.set(...p);o.castShadow=o.receiveShadow=true;scene.add(o);return o}const ground=make(new THREE.PlaneGeometry(90,90),0xd2ad6d);ground.rotation.x=-Math.PI/2;for(let i=0;i<70;i++){const d=make(new THREE.CircleGeometry(.18+Math.random()*.65,10),Math.random()>.5?0xba8c4d:0xe2c080,[(Math.random()-.5)*45,.012,(Math.random()-.5)*45]);d.rotation.x=-Math.PI/2;d.scale.y=.45}

const loader=new GLTFLoader(),sheep=[],mixers=[];let sheepSource=null,sheepAnims=[],truck=null,truckTarget=null,feedStock=12,troughFood=35,waterLevel=100,selected=null;const stateNames={wander:'يتجول',idle:'واقف يراقب',seekFood:'رايح للمعلف',eat:'يأكل',seekWater:'رايح للماء',drink:'يشرب',rest:'يرتاح',social:'يتقرب من القطيع',startled:'مفزوع من الوايت'};
function shadows(root){root.traverse(o=>{if(o.isMesh||o.isSkinnedMesh){o.castShadow=o.receiveShadow=true;o.frustumCulled=false}})}function normalize(root,h){root.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(root),n=Math.max(.001,b.max.y-b.min.y);root.scale.multiplyScalar(h/n);root.updateMatrixWorld(true);const b2=new THREE.Box3().setFromObject(root);root.position.y-=b2.min.y}function blackNajdi(root,ram){root.traverse(o=>{if(o.isMesh||o.isSkinnedMesh){o.material=Array.isArray(o.material)?o.material.map(m=>m.clone()):o.material.clone();for(const m of(Array.isArray(o.material)?o.material:[o.material]))if(m.color){const l=m.color.r+m.color.g+m.color.b;l>1.25?m.color.set(ram?0x1a1713:0x25211c):m.color.multiplyScalar(.32);m.roughness=.76}}})}
function findClip(rx,fallback){return sheepAnims.find(a=>rx.test(a.name))||fallback}function setAnim(s,name){const u=s.userData;if(!u.mixer)return;let clip=name==='walk'?u.clips.walk:name==='idle'?u.clips.idle:name==='eat'?u.clips.eat:u.clips.idle;if(!clip||u.anim===name)return;const next=u.mixer.clipAction(clip);next.reset().fadeIn(.22).play();if(u.action)u.action.fadeOut(.22);u.action=next;u.anim=name}
function releaseSlot(s){const u=s.userData;if(u.slot){u.slot.owner=null;u.slot=null}}function nearestFree(slots,s){let best=null,bd=1e9;for(const sl of slots)if(!sl.owner||sl.owner===s){const d=s.position.distanceToSquared(sl.p);if(d<bd){bd=d;best=sl}}if(best){best.owner=s;s.userData.slot=best}return best}function validWander(x,z){if(x<-10.3||x>10.3||z<-9.3||z>9.3)return false;for(const o of obstacles)if(Math.abs(x-o.x)<o.hx+.7&&Math.abs(z-o.z)<o.hz+.7)return false;return true}function pickWander(s){releaseSlot(s);for(let k=0;k<15;k++){const x=-9+Math.random()*18,z=-8+Math.random()*16;if(validWander(x,z)){s.userData.target.set(x,0,z);break}}s.userData.state='wander';s.userData.timer=2+Math.random()*6}

document.querySelector('#feedBtn').onclick=()=>{if(feedStock<=0)return toast('ما بقى شعير بالمخزون');feedStock--;troughFood=Math.min(100,troughFood+32);updateResources();toast('عبّيت المعلف — الجوعان بيجي من نفسه 🌾')};document.querySelector('#waterBtn').onclick=()=>{waterLevel=100;updateResources();toast('عبّيت حوض الماء 💧')};document.querySelector('#truckBtn').onclick=()=>{if(!truck)return toast('الوايت ما حمل');truckTarget=truckTarget?null:new THREE.Vector3(7,0,7);toast(truckTarget?'شغلت الوايت 🛻':'طفيت الوايت')};document.querySelector('#marketBtn').onclick=()=>toast('السوق بنبنيه بعد ما نضبط الحياة داخل العزبة');
function steer(s,dt){const u=s.userData,d=u.target.clone().sub(s.position);d.y=0;if(d.length()<.05)return true;let desired=d.normalize();for(const other of sheep){if(other===s)continue;const off=s.position.clone().sub(other.position),dist=off.length();if(dist<1.15&&dist>.001)desired.add(off.normalize().multiplyScalar((1.15-dist)*1.8))}for(const o of obstacles){const dx=s.position.x-o.x,dz=s.position.z-o.z,nx=Math.max(-o.hx,Math.min(o.hx,dx)),nz=Math.max(-o.hz,Math.min(o.hz,dz)),px=dx-nx,pz=dz-nz,dd=Math.hypot(px,pz);if(dd<1.15){if(dd>.01)desired.add(new THREE.Vector3(px/dd,0,pz/dd).multiplyScalar((1.15-dd)*2.4));else desired.add(new THREE.Vector3(dx||1,0,dz||1).normalize().multiplyScalar(2))}}if(s.position.x<-9.7)desired.x+=2;if(s.position.x>9.7)desired.x-=2;if(s.position.z<-8.7)desired.z+=2;if(s.position.z>8.7)desired.z-=2;desired.normalize();const dist=s.position.distanceTo(u.target),speed=u.speed*Math.min(1,Math.max(.25,dist/1.2));const next=s.position.clone().addScaledVector(desired,speed*dt);let blocked=false;for(const o of obstacles)if(Math.abs(next.x-o.x)<o.hx+.48&&Math.abs(next.z-o.z)<o.hz+.48){blocked=true;break}if(!blocked){s.position.copy(next);s.rotation.y=THREE.MathUtils.lerp(s.rotation.y,Math.atan2(desired.x,desired.z)-Math.PI/2,.12)}return dist<.34}
function behavior(s,dt,t){const u=s.userData;u.hunger=Math.min(100,u.hunger+dt*.7);u.thirst=Math.min(100,u.thirst+dt*.9);u.energy=Math.max(0,u.energy-dt*.18);u.social=Math.max(0,u.social-dt*.12);if(truck&&truckTarget&&s.position.distanceTo(truck.position)<3.3&&u.state!=='startled'){releaseSlot(s);u.state='startled';u.startle=2.5;const away=s.position.clone().sub(truck.position).setY(0).normalize();u.target.copy(s.position).addScaledVector(away,4);u.target.x=THREE.MathUtils.clamp(u.target.x,-9,9);u.target.z=THREE.MathUtils.clamp(u.target.z,-8,8)}if(u.state==='startled'){setAnim(s,'walk');steer(s,dt);if((u.startle-=dt)<=0)decide(s);return}if(u.state==='seekFood'||u.state==='seekWater'||u.state==='wander'||u.state==='social'){setAnim(s,'walk');if(steer(s,dt)){if(u.state==='seekFood'){u.state='eat';u.timer=3.5+Math.random()*5}else if(u.state==='seekWater'){u.state='drink';u.timer=2.5+Math.random()*4}else if(u.state==='social'){u.social=Math.min(100,u.social+35);u.state='idle';u.timer=2}else{u.state='idle';u.timer=1+Math.random()*3}}return}if(u.state==='eat'){setAnim(s,'eat');s.rotation.z=.035*Math.sin(t*3+u.phase);u.hunger=Math.max(0,u.hunger-dt*12);troughFood=Math.max(0,troughFood-dt*.75);if((u.timer-=dt)<=0||u.hunger<18||troughFood<=0){s.rotation.z=0;releaseSlot(s);u.state='idle';u.timer=1;decide(s)}return}if(u.state==='drink'){setAnim(s,'eat');s.rotation.z=.025*Math.sin(t*2.6+u.phase);u.thirst=Math.max(0,u.thirst-dt*18);waterLevel=Math.max(0,waterLevel-dt*.55);if((u.timer-=dt)<=0||u.thirst<12||waterLevel<=0){s.rotation.z=0;releaseSlot(s);decide(s)}return}if(u.state==='rest'){setAnim(s,'idle');u.energy=Math.min(100,u.energy+dt*5);s.rotation.z=.025*Math.sin(t*1.2+u.phase);if((u.timer-=dt)<=0||u.energy>68){s.rotation.z=0;decide(s)}return}setAnim(s,'idle');s.rotation.y+=Math.sin(t*.8+u.phase)*dt*.02;if((u.timer-=dt)<=0)decide(s)}
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let down={x:0,y:0,t:0};renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()}});renderer.domElement.addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-down.x,e.clientY-down.y)>10||performance.now()-down.t>450)return;pointer.x=e.clientX/innerWidth*2-1;pointer.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(sheep,true);if(hits.length){let o=hits[0].object;while(o.parent&&!sheep.includes(o))o=o.parent;if(sheep.includes(o)){selected=o;document.querySelector('#animal').classList.add('on');refreshCard()}}});document.querySelector('#pet').onclick=()=>{if(!selected)return;selected.userData.social=Math.min(100,selected.userData.social+22);selected.userData.state='idle';selected.userData.timer=2.5;toast(selected.userData.name+' هدت وصارت أليف أكثر 🤚');refreshCard()};function refreshCard(){if(!selected)return;const u=selected.userData;document.querySelector('#aname').textContent=u.name;document.querySelector('#astate').textContent=stateNames[u.state]||u.state;for(const k of['hunger','thirst','social'])document.querySelector('#'+k).style.width=(k==='hunger'||k==='thirst'?100-u[k]:u[k])+'%';document.querySelector('#energy').style.width=u.energy+'%'}
let pointers=new Map(),last=null,lastD=0,target=new THREE.Vector3(),zoom=1;renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY})});renderer.domElement.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=[...pointers.values()];if(a.length===1){if(last){target.x-=(a[0].x-last.x)*.017*zoom;target.z-=(a[0].y-last.y)*.017*zoom;target.x=THREE.MathUtils.clamp(target.x,-8,8);target.z=THREE.MathUtils.clamp(target.z,-8,8)}last={...a[0]}}else{const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastD)zoom=THREE.MathUtils.clamp(zoom-(d-lastD)*.004,.58,1.5);lastD=d}});function pup(e){pointers.delete(e.pointerId);last=null;lastD=0}renderer.domElement.addEventListener('pointerup',pup);renderer.domElement.addEventListener('pointercancel',pup);
const clock=new THREE.Clock();let uiTick=0;function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04),t=performance.now()/1000;for(const s of sheep)behavior(s,dt,t);mixers.forEach(m=>m.update(dt));if(truck&&truckTarget){const d=truckTarget.clone().sub(truck.position);d.y=0;if(d.length()>.45){d.normalize();truck.position.addScaledVector(d,1.7*dt);truck.rotation.y=THREE.MathUtils.lerp(truck.rotation.y,Math.atan2(d.x,d.z)-Math.PI/2,.08)}else truckTarget=truck.position.x>0?new THREE.Vector3(-6,0,8):new THREE.Vector3(7,0,7)}if((uiTick+=dt)>.25){uiTick=0;updateResources();refreshCard()}const cp=new THREE.Vector3(target.x+13*zoom,18*zoom,target.z+22*zoom);camera.position.lerp(cp,.055);camera.lookAt(target);renderer.render(scene,camera)}updateResources();loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
