function worldPos(e){let r=C.getBoundingClientRect();return{x:cam.x+(e.clientX-r.left-W/2)/cam.z,y:cam.y+(e.clientY-r.top-H/2)/cam.z}}let drag=null,pinch=0;C.addEventListener('pointerdown',e=>{C.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY,cx:cam.tx,cy:cam.ty,moved:false}});C.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>6)drag.moved=true;cam.tx=clamp(drag.cx-dx/cam.z,250,2250);cam.ty=clamp(drag.cy-dy/cam.z,300,1800)});C.addEventListener('pointerup',e=>{if(!drag)return;if(!drag.moved){let p=worldPos(e),best=null,bd=45/cam.z;for(let a of animals){let d=Math.hypot(a.x-p.x,a.y-p.y);if(d<bd){best=a;bd=d}}S.selected=best}drag=null});C.addEventListener('wheel',e=>{e.preventDefault();cam.tz=clamp(cam.tz*(e.deltaY>0?.9:1.1),.65,1.7)},{passive:false});C.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});C.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);cam.tz=clamp(cam.tz*d/pinch,.65,1.7);pinch=d}},{passive:true});
