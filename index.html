<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#173f2c"><title>عزبة نجد</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#163c2a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:fixed;inset:0;pointer-events:none}.top{position:absolute;top:max(9px,env(safe-area-inset-top));left:9px;right:9px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.badge{background:linear-gradient(180deg,#3c291ce8,#21170fee);border:2px solid #e6c48d;border-radius:14px;color:#fff;box-shadow:0 4px 14px #0008;padding:7px 10px;text-shadow:0 1px 1px #000;font-weight:800}.title{font-size:16px}.stats{font-size:10px;line-height:1.55;text-align:right}.hint{position:absolute;top:82px;left:50%;transform:translateX(-50%);background:#152019c9;color:white;border:1px solid #ffffff50;border-radius:18px;padding:6px 12px;font-size:10px;transition:.4s;white-space:nowrap}.toolbar{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:9px;right:9px;display:flex;justify-content:center;gap:6px;pointer-events:auto}.slot{width:58px;height:58px;border:2px solid #e5c287;border-radius:13px;background:linear-gradient(#5a3d27e8,#2b1d13ee);box-shadow:0 4px 0 #15100c,0 7px 16px #0007;color:#fff;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.slot b{font-size:22px;line-height:1}.slot:active{transform:translateY(3px);box-shadow:0 1px 0 #15100c}.toast{position:absolute;bottom:84px;left:50%;transform:translateX(-50%) translateY(10px);opacity:0;background:#1b2018e9;color:white;padding:8px 13px;border-radius:14px;font-size:11px;transition:.2s;white-space:nowrap}.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}.panel{position:absolute;right:10px;top:90px;width:170px;background:#f4e9cfee;border:2px solid #75502d;border-radius:15px;padding:9px;color:#332418;display:none;box-shadow:0 8px 20px #0006;pointer-events:auto}.panel.on{display:block}.panel h3{margin:0 0 5px;font-size:14px}.panel p{margin:3px 0;font-size:10px}.meter{height:7px;background:#c9baa0;border-radius:8px;overflow:hidden;margin-top:2px}.meter i{display:block;height:100%;background:#6e9747}.pet{width:100%;border:0;border-radius:9px;background:#d49b39;color:#2d1e10;font-weight:900;padding:7px;margin-top:6px}.vignette{position:absolute;inset:0;box-shadow:inset 0 0 80px #00170b66;pointer-events:none}
</style></head><body><canvas id="game"></canvas><div class="hud"><div class="top"><div class="badge stats">اليوم 1<br>🪙 <span id="coins">850</span>　🌾 <span id="feed">12</span><br>🐑 <span id="count">10</span>/10</div><div class="badge title">🐑 عزبة نجد</div></div><div id="hint" class="hint">اسحب العالم • اضغط على الحيوان</div><div id="toast" class="toast"></div><div id="panel" class="panel"><h3 id="pname">نجدية</h3><p id="pstate">تتمشى</p><p>الشبع</p><div class="meter"><i id="ph" style="width:70%"></i></div><p>الارتواء</p><div class="meter"><i id="pt" style="width:80%"></i></div><p>الطاقة</p><div class="meter"><i id="pe" style="width:90%"></i></div><button id="pet" class="pet">ربّت عليها 🤚</button></div><div class="toolbar"><button class="slot" id="feedBtn"><b>🌾</b>شعير</button><button class="slot" id="waterBtn"><b>💧</b>ماء</button><button class="slot" id="truckBtn"><b>🛻</b>الوايت</button><button class="slot" id="marketBtn"><b>🧺</b>السوق</button><button class="slot" id="homeBtn"><b>🏕️</b>المخيم</button></div><div class="vignette"></div></div>
<script>
(()=>{'use strict';
const C=document.getElementById('game'),ctx=C.getContext('2d',{alpha:false});let DPR=Math.min(devicePixelRatio||1,2),W=0,H=0;const WORLD=1800,TAU=Math.PI*2;let cam={x:900,y:900,z:1.05,tx:900,ty:900,tz:1.05};
const $=s=>document.querySelector(s),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let seed=918273;const rnd=()=>((seed=(seed*1664525+1013904223)>>>0)/4294967296),rr=(a,b)=>a+rnd()*(b-a);
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);C.width=W*DPR;C.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}resize();addEventListener('resize',resize);
function roundRect(g,x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}function poly(g,pts){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath()}
const bg=document.createElement('canvas');bg.width=bg.height=WORLD;const b=bg.getContext('2d');
function grassBlob(x,y,r,c){b.fillStyle=c;b.beginPath();for(let i=0;i<18;i++){const a=i/18*TAU,rad=r*(.78+rr(0,.35));const px=x+Math.cos(a)*rad,py=y+Math.sin(a)*rad;i?b.lineTo(px,py):b.moveTo(px,py)}b.closePath();b.fill()}
function drawTerrain(){const g=b.createLinearGradient(0,0,0,WORLD);g.addColorStop(0,'#315f34');g.addColorStop(.45,'#3f7d3b');g.addColorStop(1,'#315f34');b.fillStyle=g;b.fillRect(0,0,WORLD,WORLD);
for(let i=0;i<150;i++)grassBlob(rr(80,1720),rr(80,1720),rr(45,150),rnd()>.5?'#3a7136':'#4a873f');
// beach and river
b.fillStyle='#d7c07e';b.beginPath();b.moveTo(1360,0);b.bezierCurveTo(1270,260,1460,380,1390,610);b.bezierCurveTo(1340,780,1480,900,1800,940);b.lineTo(1800,0);b.closePath();b.fill();
b.fillStyle='#62aeb5';b.beginPath();b.moveTo(1465,0);b.bezierCurveTo(1370,250,1570,390,1490,610);b.bezierCurveTo(1435,770,1570,840,1800,850);b.lineTo(1800,0);b.closePath();b.fill();
b.strokeStyle='#a7d8cc88';b.lineWidth=4;for(let i=0;i<14;i++){b.beginPath();const y=rr(70,800);b.moveTo(rr(1470,1530),y);b.quadraticCurveTo(rr(1580,1700),y+rr(-20,20),1790,y+rr(-10,10));b.stroke()}
// dirt paths
b.strokeStyle='#846c44';b.lineCap='round';b.lineWidth=92;b.globalAlpha=.56;b.beginPath();b.moveTo(230,1450);b.bezierCurveTo(500,1200,520,1050,780,920);b.bezierCurveTo(1010,805,1130,720,1390,670);b.stroke();b.globalAlpha=1;b.strokeStyle='#b49a67';b.lineWidth=46;b.stroke();
// platform
b.save();b.translate(900,870);b.rotate(-.07);b.fillStyle='#6a4528';roundRect(b,-150,-95,300,190,10);b.fill();for(let x=-135;x<145;x+=28){b.fillStyle=x%56===0?'#9a6b3e':'#845a34';b.fillRect(x,-82,22,164);b.strokeStyle='#3b291b55';b.strokeRect(x,-82,22,164)}b.restore();
// micro grass / flowers
for(let i=0;i<1600;i++){const x=rr(30,1760),y=rr(30,1760);if(x>1360&&y<940)continue;const s=rr(1,3);b.fillStyle=rnd()<.06?(rnd()<.5?'#f5e8b6':'#d9c9f0'):(rnd()<.12?'#8cb852':'#214f2c');b.fillRect(x,y,s,s*2)}
// rocks
for(let i=0;i<90;i++){const x=rr(60,1710),y=rr(60,1710);if(Math.hypot(x-900,y-870)<240)continue;b.fillStyle='#5e695d55';b.beginPath();b.ellipse(x+5,y+7,rr(12,30),rr(7,15),0,0,TAU);b.fill();b.fillStyle=rnd()>.5?'#9a9e89':'#7d8978';poly(b,[[x-18,y+7],[x-10,y-12],[x+8,y-18],[x+24,y],[x+9,y+14]]);b.fill()}
}
drawTerrain();
const trees=[],bushes=[],flowers=[];for(let i=0;i<95;i++){let x,y;do{x=rr(60,1740);y=rr(60,1740)}while(Math.hypot(x-900,y-870)<240||(x>1320&&y<970));trees.push({x,y,s:rr(.72,1.35),phase:rr(0,TAU),kind:rnd()<.18?1:0})}for(let i=0;i<130;i++){let x=rr(40,1760),y=rr(40,1760);if(x>1350&&y<950){i--;continue}bushes.push({x,y,s:rr(.5,1.1),phase:rr(0,TAU)})}for(let i=0;i<90;i++)flowers.push({x:rr(100,1650),y:rr(100,1650),c:rnd()<.5?'#f3e6b8':'#d7c8ef'});
function tree(o,t){const sway=Math.sin(t*1.1+o.phase)*2*o.s;ctx.save();ctx.translate(o.x,o.y);ctx.scale(o.s,o.s);ctx.fillStyle='#17321b55';ctx.beginPath();ctx.ellipse(12,20,34,16,.2,0,TAU);ctx.fill();ctx.fillStyle='#594126';ctx.fillRect(-5,0,10,38);const cols=o.kind?['#214d2e','#2e6840','#3d7d4b']:['#1c4c25','#2d6a31','#3d7d36'];for(let k=0;k<7;k++){const a=k/7*TAU,r=k<3?20:30,x=Math.cos(a)*r+sway,y=-12+Math.sin(a)*r*.55;ctx.fillStyle=cols[k%3];ctx.beginPath();ctx.arc(x,y,24,0,TAU);ctx.fill()}ctx.restore()}
function bush(o,t){ctx.save();ctx.translate(o.x,o.y);ctx.scale(o.s,o.s);ctx.fillStyle='#153e2066';ctx.beginPath();ctx.ellipse(5,8,23,12,0,0,TAU);ctx.fill();for(let k=0;k<5;k++){ctx.fillStyle=k%2?'#2c6c31':'#397c39';ctx.beginPath();ctx.arc(Math.cos(k*1.7)*13,Math.sin(k*1.7)*8,13,0,TAU);ctx.fill()}ctx.restore()}
// interactive world props
const feeder={x:690,y:1100,w:170,h:50},trough={x:1080,y:1130,w:130,h:48},camp={x:830,y:1120};let stock=12,food=55,water=100,coins=850,truckOn=false,selected=null;
function propShadow(x,y,w,h){ctx.fillStyle='#10271955';ctx.beginPath();ctx.ellipse(x+8,y+h*.55,w*.55,h*.34,0,0,TAU);ctx.fill()}
function drawFeeder(){propShadow(feeder.x,feeder.y,feeder.w,feeder.h);ctx.save();ctx.translate(feeder.x,feeder.y);ctx.fillStyle='#59442f';roundRect(ctx,-85,-25,170,50,8);ctx.fill();ctx.fillStyle='#d5ad41';roundRect(ctx,-72,-14,144,22,5);ctx.fill();ctx.strokeStyle='#2c241a';ctx.lineWidth=4;ctx.strokeRect(-82,-22,164,44);ctx.restore()}
function drawTrough(){propShadow(trough.x,trough.y,trough.w,trough.h);ctx.save();ctx.translate(trough.x,trough.y);ctx.fillStyle='#596865';roundRect(ctx,-65,-24,130,48,8);ctx.fill();ctx.fillStyle='#4ca9bd';roundRect(ctx,-56,-14,112,22,5);ctx.fill();ctx.strokeStyle='#a9d9dd';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-48,-8);ctx.quadraticCurveTo(0,-2,48,-8);ctx.stroke();ctx.restore()}
function drawCamp(t){ctx.save();ctx.translate(camp.x,camp.y);ctx.fillStyle='#3c2a1d';ctx.beginPath();ctx.ellipse(0,10,32,15,0,0,TAU);ctx.fill();for(let i=0;i<7;i++){const a=i/7*TAU;ctx.fillStyle='#7a7464';ctx.beginPath();ctx.arc(Math.cos(a)*24,Math.sin(a)*10+8,7,0,TAU);ctx.fill()}for(let i=0;i<3;i++){ctx.fillStyle=i?'#ff9a25':'#ffe05a';ctx.beginPath();ctx.moveTo(-11+i*5,7);ctx.quadraticCurveTo(Math.sin(t*4+i)*8,-35-i*5,12-i*4,7);ctx.closePath();ctx.fill()}ctx.restore()}
function drawTruck(t){const x=1220+Math.sin(t*.22)*150,y=1280+Math.cos(t*.18)*45;drawTruck.x=x;drawTruck.y=y;ctx.save();ctx.translate(x,y);ctx.rotate(-.18+Math.sin(t*.12)*.1);propShadow(0,0,120,50);ctx.fillStyle='#e8e4da';roundRect(ctx,-62,-28,124,56,8);ctx.fill();ctx.fillStyle='#d6d1c6';ctx.fillRect(10,-24,44,48);ctx.fillStyle='#6ea2aa';ctx.fillRect(-43,-22,34,18);ctx.fillStyle='#4a4c49';ctx.fillRect(-67,-17,7,34);ctx.fillStyle='#222';for(const px of[-38,37])for(const py of[-30,30]){ctx.beginPath();ctx.arc(px,py,9,0,TAU);ctx.fill()}ctx.fillStyle='#b44';ctx.fillRect(54,-20,5,10);ctx.restore()}
// animals
const animals=[];const names=['نجدية 1','نجدية 2','نجدية 3','نجدية 4','نجدية 5','نجدية 6','نجدية 7','نجدية 8','نجدية 9','الفحل صنف'];for(let i=0;i<10;i++){animals.push({x:rr(570,1120),y:rr(650,1220),tx:0,ty:0,v:rr(18,30),a:rr(0,TAU),phase:rr(0,TAU),state:'wander',timer:rr(1,5),hunger:rr(20,60),thirst:rr(15,55),energy:rr(55,95),name:names[i],ram:i===9,scale:i===9?1.1:rr(.86,1),social:rr(40,90)});pick(animals[i])}
function blocked(x,y){if(Math.abs(x-feeder.x)<120&&Math.abs(y-feeder.y)<70)return true;if(Math.abs(x-trough.x)<95&&Math.abs(y-trough.y)<65)return true;return x<310||x>1320||y<420||y>1390}
function pick(a){for(let k=0;k<20;k++){const x=rr(420,1280),y=rr(500,1370);if(!blocked(x,y)){a.tx=x;a.ty=y;break}}a.state='wander';a.timer=rr(2,6)}
function updateAnimal(a,dt){a.hunger=clamp(a.hunger+dt*1.1,0,100);a.thirst=clamp(a.thirst+dt*1.3,0,100);if(a.state==='eat'){a.timer-=dt;a.hunger=clamp(a.hunger-dt*12,0,100);food=clamp(food-dt*.4,0,100);if(a.timer<=0||a.hunger<15||food<=1)pick(a);return}if(a.state==='drink'){a.timer-=dt;a.thirst=clamp(a.thirst-dt*14,0,100);water=clamp(water-dt*.35,0,100);if(a.timer<=0||a.thirst<12||water<=1)pick(a);return}if(a.state==='rest'){a.timer-=dt;a.energy=clamp(a.energy+dt*8,0,100);if(a.timer<=0||a.energy>90)pick(a);return}if(a.hunger>62&&food>0){a.tx=feeder.x+rr(-70,70);a.ty=feeder.y-55;a.state='seekFood'}else if(a.thirst>64&&water>0){a.tx=trough.x+rr(-45,45);a.ty=trough.y-55;a.state='seekWater'}else if(a.energy<24){a.state='rest';a.timer=rr(4,8);return}if(truckOn){const dx=a.x-drawTruck.x,dy=a.y-drawTruck.y,d=Math.hypot(dx,dy);if(d<150){a.tx=a.x+dx/d*170;a.ty=a.y+dy/d*170;a.state='startled'}}
const dx=a.tx-a.x,dy=a.ty-a.y,d=Math.hypot(dx,dy);if(d<5){if(a.state==='seekFood'){a.state='eat';a.timer=rr(4,7)}else if(a.state==='seekWater'){a.state='drink';a.timer=rr(3,6)}else pick(a);return}let vx=dx/d,vy=dy/d;for(const q of animals){if(q===a)continue;const sx=a.x-q.x,sy=a.y-q.y,sd=Math.hypot(sx,sy);if(sd<38&&sd>0){vx+=sx/sd*(38-sd)/25;vy+=sy/sd*(38-sd)/25}}const n=Math.hypot(vx,vy)||1;vx/=n;vy/=n;a.x+=vx*a.v*dt;a.y+=vy*a.v*dt;a.a=Math.atan2(vy,vx);if(blocked(a.x,a.y)){a.x-=vx*a.v*dt*1.8;a.y-=vy*a.v*dt*1.8;pick(a)}}
function drawAnimal(a,t){const bob=(a.state==='wander'||a.state.startsWith('seek')||a.state==='startled')?Math.sin(t*8+a.phase)*2:0;ctx.save();ctx.translate(a.x,a.y+bob);ctx.rotate(a.a);ctx.scale(a.scale,a.scale);ctx.fillStyle='#13211655';ctx.beginPath();ctx.ellipse(4,10,24,11,0,0,TAU);ctx.fill();ctx.fillStyle=a.ram?'#17130f':'#211d18';ctx.beginPath();ctx.ellipse(0,0,27,16,0,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(23,-7,11,14,-.35,0,TAU);ctx.fill();ctx.strokeStyle='#191510';ctx.lineWidth=5;for(const lx of[-12,10]){ctx.beginPath();ctx.moveTo(lx,9);ctx.lineTo(lx+Math.sin(t*7+a.phase)*4,22);ctx.stroke()}ctx.lineWidth=3;for(const ey of[-11,1]){ctx.beginPath();ctx.moveTo(27,ey);ctx.lineTo(38,ey-7);ctx.stroke()}if(a.ram){ctx.strokeStyle='#c8aa72';ctx.lineWidth=3;for(const s of[-1,1]){ctx.beginPath();ctx.arc(24,s*9-7,8,-1.2,1.7);ctx.stroke()}}if(a.state==='eat'||a.state==='drink')ctx.rotate(Math.sin(t*3+a.phase)*.03);ctx.restore()}
const motes=Array.from({length:55},()=>({x:rr(300,1350),y:rr(400,1350),p:rr(0,TAU),s:rr(.5,1.3)}));
function worldToScreen(x,y){return{x:(x-cam.x)*cam.z+W/2,y:(y-cam.y)*cam.z+H/2}}
function draw(t,dt){ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#102a1d';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2,H/2);ctx.scale(cam.z,cam.z);ctx.translate(-cam.x,-cam.y);ctx.drawImage(bg,0,0);
// far-to-near painter ordering
const objs=[];for(const x of bushes)objs.push({y:x.y,f:()=>bush(x,t)});for(const x of trees)objs.push({y:x.y+20,f:()=>tree(x,t)});for(const a of animals)objs.push({y:a.y,f:()=>drawAnimal(a,t)});objs.push({y:feeder.y,f:drawFeeder},{y:trough.y,f:drawTrough},{y:camp.y,f:()=>drawCamp(t)});if(truckOn)objs.push({y:1280,f:()=>drawTruck(t)});objs.sort((a,b)=>a.y-b.y);for(const o of objs)o.f();for(const m of motes){const alpha=.25+.25*Math.sin(t*1.7+m.p);ctx.fillStyle=`rgba(255,242,167,${alpha})`;ctx.beginPath();ctx.arc(m.x+Math.sin(t*.4+m.p)*8,m.y+Math.cos(t*.35+m.p)*5,1.4*m.s,0,TAU);ctx.fill()}ctx.restore();}
let last=performance.now();function loop(now){const dt=Math.min((now-last)/1000,.04);last=now;for(const a of animals)updateAnimal(a,dt);cam.x+=(cam.tx-cam.x)*.13;cam.y+=(cam.ty-cam.y)*.13;cam.z+=(cam.tz-cam.z)*.13;draw(now/1000,dt);updateUI();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function toast(s){const e=$('#toast');e.textContent=s;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
function updateUI(){$('#feed').textContent=stock;$('#coins').textContent=coins;if(selected){$('#pname').textContent=selected.name;$('#pstate').textContent=selected.state==='eat'?'تأكل':selected.state==='drink'?'تشرب':selected.state==='rest'?'مرتاحه':selected.state==='startled'?'مفزوعة من الوايت':'تتمشى بين العزبة';$('#ph').style.width=(100-selected.hunger)+'%';$('#pt').style.width=(100-selected.thirst)+'%';$('#pe').style.width=selected.energy+'%'}}
$('#feedBtn').onclick=()=>{if(stock<=0)return toast('خلص الشعير');if(food>90)return toast('المعلف ممتلئ');stock--;food=100;toast('عبّيت المعلف 🌾')};$('#waterBtn').onclick=()=>{water=100;toast('عبّيت حوض الماء 💧')};$('#truckBtn').onclick=()=>{truckOn=!truckOn;toast(truckOn?'شغلت الوايت 🛻':'وقفت الوايت')};$('#marketBtn').onclick=()=>toast('السوق راح يكون هنا قريبًا 🧺');$('#homeBtn').onclick=()=>{cam.tx=900;cam.ty=900;cam.tz=1.15;toast('رجعنا للمخيم')};$('#pet').onclick=()=>{if(selected){selected.social=100;toast('ربّت على '+selected.name+' 🤚')}};
let pts=new Map(),down=null,lastMid=null,lastDist=0,moved=false;C.addEventListener('pointerdown',e=>{C.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});down={x:e.clientX,y:e.clientY};moved=false});C.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=[...pts.values()];if(a.length===1){if(lastMid){const dx=a[0].x-lastMid.x,dy=a[0].y-lastMid.y;if(Math.hypot(dx,dy)>1)moved=true;cam.tx-=dx/cam.z;cam.ty-=dy/cam.z;cam.tx=clamp(cam.tx,250,1550);cam.ty=clamp(cam.ty,250,1550)}lastMid={...a[0]}}else if(a.length>=2){moved=true;const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastDist)cam.tz=clamp(cam.tz*(1+(d-lastDist)*.004),.7,1.65);lastDist=d}});function end(e){if(!moved&&down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<10){const wx=(e.clientX-W/2)/cam.z+cam.x,wy=(e.clientY-H/2)/cam.z+cam.y;let hit=null,bd=42/cam.z;for(const a of animals){const d=Math.hypot(wx-a.x,wy-a.y);if(d<bd){bd=d;hit=a}}selected=hit;$('#panel').classList.toggle('on',!!hit);if(hit)toast(hit.name)}pts.delete(e.pointerId);lastMid=null;lastDist=0;down=null}C.addEventListener('pointerup',end);C.addEventListener('pointercancel',end);
setTimeout(()=>$('#hint').style.opacity='0',5000);
})();
</script></body></html>
